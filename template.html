<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 'a', sub: 's1', page: 'Page one', roh: false };
  }
  renderVals() {
    const p = this.props;
    const btn = p.buttons ?? 'All three spots';
    const all = btn === 'All three spots';
    const mid = p.middle ?? 'Cards and table';
    const base = 'width: 100%; text-align: left; font: inherit; cursor: pointer; border: none; border-top: 1px solid #e3e3e3; min-height: 44px; ';
    const on = 'background: #e8eef6; color: #0b3b5c; font-weight: 700; border-left: 4px solid #2c4a7a; ';
    const off = 'background: #ffffff; color: #1c1c1c; border-left: 4px solid transparent; ';
    const S = this.state;
    const groups = [
      { id: 'a', label: 'Group (e.g. Exemptions)', subs: [
        { id: 's1', label: 'Sub-list (e.g. For homeowners)', pages: ['Page one', 'Page two', 'Page three', 'Page four'] },
        { id: 's2', label: 'Sub-list (e.g. For organizations, businesses & land)', pages: ['Page five', 'Page six'] }
      ], pages: ['Page (e.g. Exemption Forms)', 'Page (e.g. Exemption FAQ)'] },
      { id: 'b', label: 'Group (e.g. Dedications)', subs: [], pages: ['Page seven', 'Page eight'] },
      { id: 'c', label: 'Group (e.g. Affordable Housing)', subs: [], pages: ['Page nine'] }
    ];
    const menu = [];
    groups.forEach((g) => {
      const isOpen = S.open === g.id;
      menu.push({ label: (isOpen ? '−  ' : '+  ') + g.label, expanded: isOpen ? 'true' : 'false', style: base + 'font-size: 15px; padding: 12px 16px; ' + (isOpen ? 'background: #e8eef6; color: #0b3b5c; font-weight: 700; border-left: 4px solid transparent; ' : off), go: () => this.setState({ open: isOpen ? null : g.id }) });
      if (!isOpen) return;
      g.subs.forEach((sb) => {
        const subOpen = S.sub === sb.id;
        menu.push({ label: (subOpen ? '−  ' : '+  ') + sb.label, expanded: subOpen ? 'true' : 'false', style: base + 'font-size: 14px; font-weight: 700; padding: 10px 16px 10px 32px; min-height: 40px; ' + off, go: () => this.setState({ sub: subOpen ? null : sb.id }) });
        if (subOpen) sb.pages.forEach((pg) => menu.push({ label: pg, expanded: '', style: base + 'font-size: 13px; padding: 8px 16px 8px 50px; min-height: 40px; ' + (S.page === pg ? on : off), go: () => this.setState({ page: pg }) }));
      });
      g.pages.forEach((pg) => menu.push({ label: pg, expanded: '', style: base + 'font-size: 14px; padding: 9px 16px 9px 32px; min-height: 40px; ' + (S.page === pg ? on : off), go: () => this.setState({ page: pg }) }));
    });
    return {
      menu: menu,
      showLabels: this.props.showLabels ?? true,
      covers: [{ color: '#2c4a7a' }, { color: '#0f6b74' }, { color: '#5e2f6a' }, { color: '#2d4a78' }],
      showLeft: p.leftPane ?? true,
      showRight: p.rightPane ?? true,
      bannerClass: (p.bannerPhoto ?? true) ? 'd-banner' : '',
      btnAbove: all || btn === 'Above the title', btnUnder: all || btn === 'Under the title', btnInside: all || btn === 'Inside the information',
      showCards: mid !== 'Table', showTable: mid !== 'Cards',
      cards: ['Change mailing address', 'Remove exemption', 'Change care of address'],
      rows: [['E-8-10.3', 'Home Exemption'], ['E-8-10.5', 'Totally Disabled Veterans'], ['M-8-2.1C', 'Change of Status']].map((r, i) => ({ no: r[0], desc: r[1], style: 'border-bottom: 1px solid #d9d9d9; background: ' + (i % 2 ? '#f5f8fb' : '#ffffff') + ';' })),
      rohOpen: this.state.roh,
      openRoh: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ roh: true }); },
      closeRoh: () => this.setState({ roh: false })
    };
