<p style="font-size: 16px; line-height: 1.7; margin: 0 0 24px">Each year RPAD publishes statewide and county real property reports: tax rates, exemptions, records by land use class and valuation totals. Choose a tax year to see its reports. Every report is a PDF kept in the City’s online <a href="docushare-example.html" style="font-weight: 700">DocuShare</a> library, the same way CSD links its reports. You can also <a href="docushare-example.html" style="font-weight: 700">browse all years in DocuShare ↗</a>.</p>

<script src="js/rpad-runtime.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { year: '2026-27' };
  }
  renderVals() {
    const years = [];
    for (let y = 2026; y >= 1981; y--) {
      years.push(y + '-' + String((y + 1) % 100).padStart(2, '0'));
    }
    return {
      year: this.state.year,
      years: years,
      pickYear: (e) => this.setState({ year: e.target.value }),
      statewide: [
        'Tax Rates',
        'Number and Amount of Exemptions by Type and County',
        'Number of Records by Land Use Class',
        'Real Property Valuation Totals'
      ],
      county: [
        'City & County of Honolulu – Valuation Totals',
        'Maui County – Valuation Totals',
        'Hawaiʻi County – Valuation Totals',
        'Kauaʻi County – Valuation Totals'
      ]
    };
  }
}
rpadMount(Component, {}, {});
</script>
