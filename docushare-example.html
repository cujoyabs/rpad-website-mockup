<template id="rpad-template">
<div style="width: 1280px; height: 920px; box-sizing: border-box; background: #e9ebee; font-family: Arial, Helvetica, sans-serif; color: #222222; padding: 32px; display: flex; flex-direction: column; gap: 16px">
<div style="background: #e3f2e5; border: 1px solid #8fc29a; padding: 12px 16px; font-size: 14px; line-height: 1.5">
<strong>Real example:</strong> the City's DocuShare page that CSD's "Department &amp; Agency Reports" page links to (Collection-2299, screenshot 10/29/2026). This is what visitors would land on if RPAD's older Statewide Reports moved to DocuShare.
</div>
<img src="img/62d29d1ef445cabac6d97651e2931d20.png" alt="Screenshot of the City DocuShare collection listing Departmental and Agency Reports of the City and County of Honolulu as PDF files with owner, modified date and size" style="width: 1216px; height: auto; border: 1px solid #b9bec6; background: #ffffff">
<div style="display: flex; gap: 16px; font-size: 14px; line-height: 1.5">
<div style="flex: 1; background: #ffffff; border: 1px solid #b9bec6; padding: 12px 14px"><strong>What it shows:</strong> one flat list of PDFs (58 files, 20 per page), newest first, with owner, modified date and size. Location path across the top; search box; cookie notice.</div>
<div style="flex: 1; background: #ffffff; border: 1px solid #b9bec6; padding: 12px 14px"><strong>For RPAD:</strong> ~370 report PDFs in one flat list would be ~19 pages to click through. One folder per tax year (8 files each) would be much easier to browse.</div>
</div>
