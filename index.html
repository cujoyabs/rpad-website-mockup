<template id="rpad-template">
<div style="font-family: Montserrat, Arial, sans-serif; color: #1c1c1c; background: #ffffff; width: 100%">

<header style="background: #ffffff; border-bottom: 1px solid #dddddd">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<img src="img/60702182f58644eded21bbac4225260b.png" alt="City and County of Honolulu seal" style="width: 52px; height: 52px; object-fit: contain">
<div style="line-height: 1.1"><div style="font-size: 10px; letter-spacing: 1px">CITY AND COUNTY OF</div><div style="font-size: 18px; font-weight: 800">HONOLULU</div></div>
</div>
<nav aria-label="Main menu" style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px; font-weight: 600">
<a href="index.html" style="text-decoration: none; border-bottom: 2px solid #0f6b74; padding-bottom: 4px">Home</a>
<a href="tax-relief-forms.html" style="text-decoration: none">Tax Relief &amp; Forms</a>
<a href="statewide-reports.html" style="text-decoration: none">Statewide Reports</a>
<a href="appeals.html" style="text-decoration: none">Appeals</a>
<a href="help-resources.html" style="text-decoration: none">Help &amp; Resources</a>
<a href="contact-us.html" style="text-decoration: none">Contact Us</a>
</nav>
</div>
</header>

<section class="rpad-banner" style="color: #ffffff; position: relative; overflow: hidden">
<div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 44px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 28px; justify-content: flex-start; min-height: 280px; text-shadow: 0 1px 3px rgba(0,0,0,0.5)">
<img src="img/250bc961682ebb096452e7fce7a9e114.png" alt="Real Property Assessment Division seal" style="width: 160px; height: 160px; object-fit: contain">
<div style="text-align: left">
<div style="font-size: 38px; font-weight: 800; letter-spacing: 1px; line-height: 1.15">REAL PROPERTY<br>ASSESSMENT DIVISION</div>
<div style="font-size: 16px; margin-top: 8px">Department of Budget and Fiscal Services</div>
<div style="font-size: 15px; font-style: italic; margin-top: 4px; color: #e8eef2">Ka ʻOihana Mālama Moʻohelu a Kālā<br>Ke Keʻena Hōʻoia ʻAuhau ʻĀina Kūʻiʻo</div>
</div>
</div>
</section>

<div style="background: #0b3b5c">
<div style="max-width: 1200px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px">
<a href="help-resources.html" style="display: inline-flex; align-items: center; gap: 10px; background: #ffffff; color: #0b3b5c; font-size: 15px; font-weight: 800; text-decoration: none; padding: 10px 18px; min-height: 44px; box-sizing: border-box"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; background: #2e7d4f"></span>{{newsLabel}} »</a>
<span style="color: #ffffff; font-size: 14px">{{newsLatest}}</span>
</div>
</div>

<div style="max-width: 1200px; margin: 20px auto 0; padding: 0 24px">
<div style="background: #fdecea; border: 1px solid #e5a49c; color: #6b1d14; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 15px">
<span><strong>Public alert:</strong> Beware of fraudulent “House Auction” notices. Do not send money or personal information. Verify with us at (808) 768-3799.</span>
<button type="button" aria-label="Close alert" style="background: none; border: none; font-size: 20px; color: #6b1d14; cursor: pointer; min-width: 44px; min-height: 44px">×</button>
</div>
</div>

<section style="max-width: 1200px; margin: 0 auto; padding: 28px 24px 24px">
<h2 style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Quick links</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px">
<!--sc-for list="{{tiles}}" as="t" hint-placeholder-count="4"-->
<a href="#" class="tile" style="background: {{t.bg}}; color: {{t.fg}}; text-decoration: none; padding: 24px 20px; display: flex; align-items: center; gap: 16px; transition: box-shadow .15s, transform .15s">
<span aria-hidden="true" style="flex: none; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.22); display: flex; align-items: center; justify-content: center; font-size: 24px">{{t.icon}}</span>
<span><span style="display: block; font-size: 19px; font-weight: 800">{{t.title}}</span><span style="display: block; font-size: 13px; margin-top: 3px; color: {{t.sub}}">{{t.text}}</span></span>
</a>
<!--/sc-for-->
</div>
</section>

<section aria-label="Announcements" style="background: #ffffff; padding: 8px 0 40px">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px">
<div class="{{slide.cls}}" style="position: relative; background-color: {{slide.bg}}; color: #ffffff; min-height: 260px; display: flex; align-items: center">
<button type="button" aria-label="Previous slide" onClick="{{prev}}" style="align-self: stretch; min-width: 52px; background: rgba(0,0,0,0.25); color: #ffffff; border: none; font-size: 28px; cursor: pointer">‹</button>
<div style="flex: 1; padding: 32px 28px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; font-weight: 700; letter-spacing: 1px; color: #f3d38a">{{slide.tag}}</div>
<div style="font-size: 30px; font-weight: 800; line-height: 1.2">{{slide.title}}</div>
<div style="font-size: 16px; line-height: 1.6; max-width: 720px">{{slide.text}}</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px">
<!--sc-for list="{{slide.buttons}}" as="b" hint-placeholder-count="1"-->
<a href="#" style="background: {{b.bg}}; color: {{b.fg}}; border: 2px solid {{b.border}}; padding: 12px 18px; font-size: 13px; font-weight: 700; text-decoration: none; text-transform: uppercase; text-shadow: none; text-align: center">{{b.label}}</a>
<!--/sc-for-->
</div>
</div>
<button type="button" aria-label="Next slide" onClick="{{next}}" style="align-self: stretch; min-width: 52px; background: rgba(0,0,0,0.25); color: #ffffff; border: none; font-size: 28px; cursor: pointer">›</button>
</div>
<div style="display: flex; justify-content: center; gap: 8px; margin-top: 12px">
<!--sc-for list="{{dots}}" as="dot" hint-placeholder-count="4"-->
<button type="button" aria-label="{{dot.label}}" onClick="{{dot.go}}" style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #2c4a7a; background: {{dot.fill}}; padding: 0; cursor: pointer"></button>
<!--/sc-for-->
</div>
</div>
</section>


<section style="background: #f4f4f2">
<div style="max-width: 1200px; margin: 0 auto; padding: 40px 24px; display: flex; flex-wrap: wrap; gap: 36px">
<div style="flex: 1 1 320px">
<h2 style="font-size: 24px; font-weight: 800; color: #0b3b5c; margin: 0 0 16px">I want to…</h2>
<!--sc-for list="{{wants}}" as="w" hint-placeholder-count="6"-->
<a href="{{w.href}}" style="display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 4px; border-bottom: 1px solid #c9d3e0; text-decoration: none; color: #0b3b5c"><span><span style="display: block; font-size: 16px; font-weight: 600">{{w.t}}</span><span style="display: block; font-size: 12px; color: #555555; margin-top: 2px">{{w.to}}</span></span><span aria-hidden="true">›</span></a>
<!--/sc-for-->
</div>
<div style="flex: 1 1 440px">
<h2 style="font-size: 24px; font-weight: 800; color: #0b3b5c; margin: 0 0 16px">Important Dates</h2>
<div style="background: #0b3b5c; color: #ffffff; padding: 14px 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px">
<span style="font-size: 15px; font-weight: 700">Appeal deadline – January 15</span>
<span style="display: flex; gap: 8px"><!--sc-for list="{{countdown}}" as="c" hint-placeholder-count="4"--><span style="background: #14527d; padding: 6px 10px; text-align: center; min-width: 46px"><span style="display: block; font-size: 20px; font-weight: 800">{{c.n}}</span><span style="font-size: 11px">{{c.label}}</span></span><!--/sc-for--></span>
</div>
<!--sc-for list="{{deadlines}}" as="d" hint-placeholder-count="4"-->
<div style="display: flex; gap: 14px; align-items: center; background: #ffffff; border: 1px solid #d5dde8; padding: 12px 14px; margin-bottom: 10px">
<div style="flex: none; width: 58px; text-align: center; border-right: 1px solid #d5dde8; padding-right: 12px"><div style="font-size: 12px; font-weight: 800; color: #4a7d4a">{{d.mon}}</div><div style="font-size: 24px; font-weight: 800; color: #0b3b5c; line-height: 1.1">{{d.day}}</div></div>
<div style="font-size: 15px; font-weight: 600">{{d.title}}</div>
</div>
<!--/sc-for-->
<div style="font-size: 12px; color: #555555">Countdown shows only during appeal season (Dec 15 – Jan 15) · example numbers</div>
</div>
</div>
</section>

<!--sc-if value="{{showNews}}" hint-placeholder-val="{{ false }}"-->
<section id="whats-new" style="max-width: 1200px; margin: 0 auto; padding: 40px 24px 8px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 16px">
<h2 style="font-size: 24px; font-weight: 800; color: #0b3b5c; margin: 0">{{newsLabel}}</h2>
<a href="help-resources.html" style="font-size: 14px; font-weight: 700">View all news »</a>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px">
<!--sc-for list="{{news}}" as="n" hint-placeholder-count="2"-->
<a href="{{n.href}}" style="display: flex; gap: 16px; align-items: center; border: 1px solid #d5dde8; padding: 14px; text-decoration: none; color: #1c1c1c">
<!--sc-if value="{{n.hasImg}}" hint-placeholder-val="{{ true }}"--><img src="img/93d27d61112bdee1e8469a3c7f90ea0e.png" alt="Title slide: {{n.title}}" style="flex: none; width: 150px; height: 101px; object-fit: contain; border: 1px solid #e3e3e3; background: #ffffff"><!--/sc-if-->
<!--sc-if value="{{n.noImg}}" hint-placeholder-val="{{ false }}"--><div style="flex: none; width: 150px; height: 101px; background: #f2f2f2; border: 1px dashed #b8c6d9; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #555555; text-align: center">[Title slide]</div><!--/sc-if-->
<div><div style="font-size: 12px; font-weight: 700; color: #2c4a7a">{{n.date}} · {{n.kind}}</div><div style="font-size: 16px; font-weight: 800; color: #0b3b5c; margin-top: 4px">{{n.title}}</div><div style="font-size: 13px; margin-top: 4px">{{n.text}}</div><div style="font-size: 13px; font-weight: 700; color: #1f4f8a; margin-top: 6px">{{n.cta}} »</div></div>
</a>
<!--/sc-for-->
</div>
</section>
<!--/sc-if-->

<section style="max-width: 1200px; margin: 0 auto; padding: 36px 24px">
<h2 style="font-size: 22px; font-weight: 800; text-align: center; margin: 0 0 6px">Informational Videos</h2>
<p style="text-align: center; font-size: 15px; margin: 0 0 20px">Short guides to how assessments, exemptions and appeals work.</p>
<div style="display: flex; flex-wrap: wrap; gap: 20px">
<!--sc-for list="{{videos}}" as="v" hint-placeholder-count="3"-->
<a href="#" style="flex: 1 1 300px; background: #f2f2f2; text-decoration: none; color: #1c1c1c; display: flex; flex-direction: column">
<div style="aspect-ratio: 16 / 9; background: #1c1c1c; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
<svg aria-hidden="true" width="56" height="40" viewBox="0 0 56 40"><rect width="56" height="40" rx="9" fill="#d32f2f"></rect><path d="M23 12l12 8-12 8z" fill="#ffffff"></path></svg>
<span style="font-size: 12px; color: #d9d9d9">[YouTube video]</span>
</div>
<div style="padding: 14px"><div style="font-size: 16px; font-weight: 800">{{v.title}}</div><div style="font-size: 13px; margin-top: 4px">{{v.desc}}</div></div>
</a>
<!--/sc-for-->
</div>
</section>

<section class="rpad-mission" style="color: #ffffff">
<div style="max-width: 1000px; margin: 0 auto; padding: 64px 24px; text-align: center; text-shadow: 0 1px 3px rgba(0,0,0,0.6)">
<h2 style="font-size: 30px; font-weight: 800; letter-spacing: 1px; margin: 0 0 18px">Our Mission</h2>
<p style="font-size: 16px; line-height: 1.7; margin: 0">The Real Property Assessment Division administers provisions of <a href="#" style="color: #ffffff; text-decoration: underline; font-weight: 700">Chapter 8, Revised Ordinances of Honolulu</a>, relating to the assessment of real property for tax purposes. It ensures real property assessment values are fair and equitable, based on market value, and in accordance with applicable standards and laws.</p>
</div>
</section>

<footer style="background: #111111; color: #ffffff">
<div style="max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; gap: 32px; justify-content: space-between; font-size: 13px; line-height: 1.7">
<div><strong>[Name]</strong><br>Administrator<br><em>([Hawaiian title])</em></div>
<div><strong>Honolulu Office</strong> · 842 Bethel St., Basement, Honolulu, HI 96813<br><strong>Kapolei Office</strong> · 1000 Uluʻōhiʻa St., #206, Kapolei, HI 96707<br>(808) 768-3799</div>
<div><a href="#" style="color: #ffffff">Bureau of Conveyances</a><br><a href="#" style="color: #ffffff">Bureau Grantor/Grantee Search</a><br><a href="#" style="color: #ffffff">State Land Survey DAGS Map Search</a><br><a href="#" style="color: #ffffff">Honolulu Board of REALTORS®</a><br><a href="#" style="color: #ffffff">Honolulu Departments &amp; Agencies</a></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 18px"><a href="#" style="color: #ffffff">Policy</a><a href="#" style="color: #ffffff">Privacy Statement</a><a href="#" style="color: #ffffff">Accessibility Policy</a><a href="#" style="color: #ffffff">Diversity Statement</a><a href="#" style="color: #ffffff">Site Map</a></div>
<div>Copyright © 2026 Real Property Assessment Division</div>
</div>
</div>
</footer>


<div style="position: fixed; right: 20px; bottom: 20px; z-index: 50; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; font-family: Montserrat, Arial, sans-serif">
<!--sc-if value="{{chatOpen}}" hint-placeholder-val="{{ false }}"-->
<div role="dialog" aria-label="Ask RPAD chat" style="width: 320px; max-width: calc(100vw - 40px); background: #ffffff; border: 1px solid #c9d3e0; box-shadow: 0 8px 24px rgba(0,0,0,0.18); overflow: hidden">
<div style="background: #0b3b5c; color: #ffffff; padding: 12px 14px; display: flex; justify-content: space-between; align-items: center"><span style="font-weight: 800">Ask RPAD</span><button type="button" aria-label="Close chat" onClick="{{toggleChat}}" style="background: none; border: none; color: #ffffff; font-size: 20px; cursor: pointer; min-width: 36px; min-height: 36px">×</button></div>
<div style="padding: 14px; font-size: 14px; line-height: 1.5; background: #f4f6f9">
<div style="background: #ffffff; border: 1px solid #dde3ea; padding: 10px 12px; margin-bottom: 10px">Aloha! I can help with home exemptions, appeals, your Notice of Assessment, and forms. What would you like to know?</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="border: 1px solid #2c4a7a; color: #2c4a7a; padding: 5px 10px; font-size: 12px; font-weight: 700; background: #ffffff">How do I file an appeal?</span>
<span style="border: 1px solid #2c4a7a; color: #2c4a7a; padding: 5px 10px; font-size: 12px; font-weight: 700; background: #ffffff">Home exemption deadline</span>
<span style="border: 1px solid #2c4a7a; color: #2c4a7a; padding: 5px 10px; font-size: 12px; font-weight: 700; background: #ffffff">Change my mailing address</span>
</div>
</div>
<div style="display: flex; border-top: 1px solid #dde3ea"><span style="flex: 1; padding: 12px; font-size: 13px; color: #767676">Type your question…</span><span style="padding: 12px 14px; background: #2c4a7a; color: #ffffff; font-weight: 700; font-size: 13px">Send</span></div>
<div style="font-size: 11px; color: #555555; padding: 6px 12px 10px">[Mockup – our current chatbot (Revacomm) or a City option like CSD's "Ask CSD"; ask DIT]</div>
</div>
<!--/sc-if-->
<button type="button" onClick="{{toggleChat}}" aria-expanded="{{chatExpanded}}" style="display: inline-flex; align-items: center; gap: 8px; background: #0b3b5c; color: #ffffff; border: 2px solid #ffffff; border-radius: 28px; padding: 12px 18px; min-height: 48px; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.28)"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"></path></svg>Ask RPAD</button>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idx: 0, chatOpen: false };
  }
  renderVals() {
    const gold = (label) => ({ label, bg: '#f3d38a', fg: '#1c1c1c', border: '#f3d38a' });
    const light = (label) => ({ label, bg: '#d4ecf7', fg: '#1c1c1c', border: '#d4ecf7' });
    const outline = (label) => ({ label, bg: '#ffffff', fg: '#1c1c1c', border: '#1c1c1c' });
    const slides = [
      { tag: 'STORM DAMAGE', title: 'Storm damage this hurricane season?', text: 'If your property was damaged during the State of Emergency period beginning August 13, 2026, you may be eligible for a property tax refund through the Remission of Taxes program. Deadline to file: June 30, 2027.', buttons: [light('Click here for more information on Remission of Taxes')], bg: '#2c4a7a', cls: 'slide-storm' },
