<h2 style="font-size: 22px; font-weight: 800; color: #0b3b5c; margin: 0 0 8px">Appeal Information</h2>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">Appeals from real property assessments made by the City &amp; County of Honolulu's (City) Real Property Assessment Division (RPAD) are provided for in ROH Article 8-12.</p>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">The City annually sends a Notice of Assessment (NOA) to taxpayers on or before December 15. See <a href="#">the importance of reviewing your NOA</a>.</p>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">If a taxpayer has not received the NOA within a few days of December 15, the NOA information is available at <a href="#">Property Records Search</a>.</p>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">A taxpayer may contact the RPAD to discuss any questions or concerns regarding the NOA information. Frequently, these discussions result in a clearer understanding of mass appraisal standards and practices utilized by the RPAD in order to produce uniform and equitable assessments throughout the county. In many instances, misunderstandings are cleared up during the discussion.</p>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">The City is required by ordinances to assess all real property in its entirety (<a href="#">ROH§E-6.3(a)</a>). This means that the City assesses all properties on their fee simple value unless otherwise mandated by ordinance.</p>

<h2 style="font-size: 22px; font-weight: 800; color: #0b3b5c; margin: 26px 0 8px">To File an Appeal</h2>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">If a taxpayer does not agree with the assessed value of the property, the classification of the property, or the amount of the exemption allowed, an appeal may be filed by the <strong>January 15</strong> deadline to the Board of Review (BOR) of the City by filing online or submitting a completed appeal form <a href="#">BFS-RPA-M-8-12</a>.</p>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">For timely filing requirements, please refer to <a href="#">ROH §8-1.6</a>.</p>
<!--sc-if value="{{fileBody}}" hint-placeholder-val="{{ true }}"-->
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; background: #e9f3ea; border: 1px solid #9cc7a3; padding: 16px 18px; margin: 10px 0 16px">
<a href="#" style="background: #2e7d4f; color: #ffffff; padding: 13px 22px; font-size: 16px; font-weight: 800; text-decoration: none">File an Appeal Online</a>
<span style="font-size: 14px; line-height: 1.5">Open Dec 15 – Jan 15. After Jan 15, see <a href="#" onClick="{{goFileLink}}">Late Appeals</a>.</span>
</div>
<!--/sc-if-->
<div style="border-left: 4px solid #c9962b; background: #fbf6ea; padding: 14px 18px; font-size: 14px; line-height: 1.6; margin: 6px 0 4px">
<strong>Mailing your appeal? Effective Dec 24, 2025</strong>, the United States Postal Service (USPS) issued a clarification regarding postmarks and provides the following options as proof of mailing date (<a href="#">USPS postmarking overview, PDF</a>):
<ol style="margin: 8px 0 8px; padding-left: 20px">
<li style="margin-bottom: 6px"><strong>Automated Postmark (default):</strong> Applied by USPS machines at processing facilities; shows processing date. Please be aware that mail deposited in USPS collection boxes may not be postmarked on the same day it is collected by the carrier or dropped off at a Post Office.</li>
<li style="margin-bottom: 6px"><strong>Manual (local) Postmark – by request:</strong> Free at a USPS retail counter, shows the exact date USPS accepted your mail.</li>
<li style="margin-bottom: 6px"><strong>USPS Mailing Receipts:</strong> Certificate of mailing, Certified Mail, or Registered Mail, provides proof of acceptance.</li>
</ol>
Taxpayers are responsible for ensuring their filings are postmarked by the applicable deadlines.
</div>

<h2 style="font-size: 22px; font-weight: 800; color: #0b3b5c; margin: 26px 0 8px">Grounds for Appeal</h2>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">When a taxpayer files an appeal, the taxpayer must state the basis for the appeal. The ROH Section 8-12.3 specifies four grounds for appeal.</p>
<ol style="font-size: 15px; line-height: 1.7; margin: 0 0 10px; padding-left: 22px">
<li style="margin-bottom: 6px">Assessment of the property exceeds by more than 10 percent of the market value of the property</li>
<li style="margin-bottom: 6px">Lack of uniformity or inequality, brought about by illegality of the methods used or error in the application of the methods to the property involved</li>
<li style="margin-bottom: 6px">Denial of an exemption to which the taxpayer is entitled and for which such person has qualified</li>
<li style="margin-bottom: 6px">Illegality, on any ground arising under the Constitution or laws of the United States or the laws of the state or the ordinances of the city in addition to the ground of illegality of the methods used mentioned in clause 2.</li>
</ol>

<h2 style="font-size: 22px; font-weight: 800; color: #0b3b5c; margin: 26px 0 8px">How to Support Your Appeal</h2>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">Provide supporting documentation for an appeal to the assigned appraiser and the BOR. To expedite the appeal process and to minimize wait time for a BOR hearing, taxpayers are encouraged to submit evidence and supporting documentation with the appeal or shortly thereafter. This will enable the assigned appraiser to review the case in a timely manner. If a taxpayer submits evidence separately from the appeal to RPAD, include taxpayer name, Parcel ID/TMK, year of the appeal, contact information such as a phone number, mailing address, and/or email address.</p>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">The law provides that the assessment made by the Director of Budget and Fiscal Services is presumed to be correct. This means that every taxpayer who appeals must prove that the assessed value made by the director is incorrect. Unless sufficient evidence is presented, the BOR must decide in favor of the Director's assessment.</p>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">While sales of similar properties are examples of evidence, sales transactions between relatives, close friends, and persons with close business relationships are usually not considered sufficient evidence. The fact that a nearby property is assessed lower than that of the property under appeal is not sufficient evidence in and of itself for the BOR to lower an assessment. Taxpayers' support may be in the form of providing the BOR with sales of properties that are similar in terms of land area, square foot of living area, year built or remodeled, and other amenities. Types of documentation may include comparable fee simple market sales, contractor estimates to repair deficient items, and other evidence indicating the assessed value exceeds the fee simple market value by more than 10%.</p>

<div style="display: flex; flex-wrap: wrap; gap: 16px; margin: 22px 0 4px">
<div style="flex: 1 1 260px; border: 1px solid #d6d6d6; padding: 16px"><div style="font-size: 16px; font-weight: 800; margin-bottom: 6px">Second Appeal</div><div style="font-size: 14px; line-height: 1.6">If a taxpayer filed an appeal last year and the appeal is pending, an appeal on the taxpayer's behalf will automatically be placed on this year's assessment, provided the new assessment was not changed from the assessment under appeal. However, if this year's valuation differs from the valuation under appeal, the taxpayer must file a new appeal to contest this year's assessment.</div></div>
<div style="flex: 1 1 260px; border: 1px solid #d6d6d6; padding: 16px"><div style="font-size: 16px; font-weight: 800; margin-bottom: 6px">Tax Payment</div><div style="font-size: 14px; line-height: 1.6">Even though a taxpayer has an appeal pending, the taxpayer must pay all taxes by the due dates or be subject to penalty and interest charges. If the taxpayer wins the case, any overpayment will be adjusted.</div></div>
</div>

<h2 style="font-size: 22px; font-weight: 800; color: #0b3b5c; margin: 0 0 8px">Late Appeals</h2>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">Appeals submitted outside of the appeal period will be considered late filings.</p>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">To submit an appeal after the appeal period has ended on Jan 15, taxpayers must use <a href="#">Form M-8-12</a> and specify the relevant tax year.</p>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 10px">Late appeals may be submitted in one of the following methods:</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px; margin-top: 6px">
<div style="flex: 1 1 260px; border: 1px solid #d6d6d6; padding: 16px"><div style="font-size: 16px; font-weight: 800; margin-bottom: 6px">In-Person</div><div style="font-size: 14px; line-height: 1.6">Hand-delivered or walked-in filings can be made at either office:<br><br><strong>Real Property Assessment Division</strong><br>842 Bethel Street, Basement<br>Honolulu, Hawaii 96813<br><br><strong>Real Property Assessment Division</strong><br>1000 Uluʻōhiʻa Street #206<br>Kapolei, Hawaii 96707</div></div>
<div style="flex: 1 1 260px; border: 1px solid #d6d6d6; padding: 16px"><div style="font-size: 16px; font-weight: 800; margin-bottom: 6px">By Mail</div><div style="font-size: 14px; line-height: 1.6">Mail your appeal to either of the in-person addresses.</div></div>
</div>
<!--/sc-if-->

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true, view: 'info' };
  }
  renderVals() {
    const open = this.state.open, v = this.state.view;
    const base = 'width: 100%; text-align: left; font: inherit; font-size: 15px; cursor: pointer; min-height: 44px; padding: 12px 16px; border: none; border-top: 1px solid #e3e3e3; ';
    const on = 'background: #e8eef6; border-left: 4px solid #2c4a7a; color: #0b3b5c; font-weight: 700;';
    const off = 'background: #ffffff; border-left: 4px solid transparent; color: #1c1c1c;';
    const item = (label, key) => ({ label: label, style: base + (v === key ? on : off), go: () => this.setState({ view: key }) });
    const titles = { info: 'Appeal Information', file: 'File an Appeal', faq: 'Appeals FAQ' };
    return {
      fileTop: (this.props.fileButton ?? 'Top and in the text') !== 'In the text only',
      fileBody: (this.props.fileButton ?? 'Top and in the text') !== 'Top only',
      goFileLink: (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ view: 'file' }); },
      menu: [item('Appeal Information', 'info'), item('File an Appeal', 'file'), item('Appeals FAQ', 'faq')],
      isInfo: v === 'info', isFile: v === 'file', isFaq: v === 'faq',
      crumb: titles[v], pageTitle: titles[v],
      open: open,
      closed: !open,
      periodLabel: open ? 'OPEN (Dec 15 – Jan 15)' : 'CLOSED (rest of the year)',
      toggleLabel: open ? 'Show closed view' : 'Show open view',
