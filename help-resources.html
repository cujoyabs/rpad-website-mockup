<p style="font-size: 15px; line-height: 1.7; margin: 0 0 16px">Residential A is a tax classification for higher-value residential property without a home exemption. It was created by Ordinance 13-33 (effective for tax years starting July 1, 2014) and clarified by Ordinance 13-41 for vacant residential land.</p>

<a href="#" style="background: #ffffff; color: #2c4a7a; border: 2px solid #2c4a7a; padding: 10px 16px; font-size: 14px; font-weight: 700; text-decoration: none">Residential A Presentation (PDF)</a>
</div>
<h2 style="font-size: 20px; font-weight: 800; color: #0b3b5c; margin: 0 0 10px">Who is classified Residential A?</h2>
<p style="font-size: 15px; margin: 0 0 8px">Under <a href="#">ROH Section 8-7.1(c)(4)</a>, Residential A includes:</p>
<ul style="font-size: 15px; line-height: 1.7; margin: 0 0 8px; padding-left: 22px">
<li>Parcels with no more than two single-family homes, assessed at <strong>$1,000,000 or more</strong>, with <strong>no home exemption</strong>, zoned R-3.5, R-5, R-7.5, R-10 or R-20 (or dedicated for residential use).</li>
<li>Vacant land zoned R-3.5 to R-20 assessed at $1,000,000 or more.</li>
<li>Condominium units assessed at $1,000,000 or more with no home exemption.</li>
</ul>
<p style="font-size: 14px; color: #555555; margin: 0 0 22px">Military housing, on or off base, is excluded.</p>
<h2 style="font-size: 20px; font-weight: 800; color: #0b3b5c; margin: 0 0 6px">How the tax is calculated</h2>
<p style="font-size: 15px; line-height: 1.6; margin: 0 0 14px">Since July 1, 2017 (Ordinance 17-12), Residential A has two tiers: one rate on the first $1,000,000 of net taxable value and a higher rate on the amount above $1,000,000.</p>
<div style="display: flex; flex-wrap: wrap; gap: 18px; align-items: stretch">
<div style="flex: 1 1 300px; border: 1px solid #d6d6d6; display: flex; flex-direction: column">

<table style="width: 100%; border-collapse: collapse; font-size: 14px">

<tr><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3">Home Exemption</td><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3; text-align: right">$120,000</td></tr>
<tr><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3">Classification</td><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3; text-align: right">Residential</td></tr>
<tr><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3">Tax Rate</td><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3; text-align: right">$3.50 per $1,000 of net taxable</td></tr>
</table>
<div style="border-top: 1px solid #e3e3e3; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; flex: 1">
<div style="display: flex; align-items: flex-start; justify-content: center; gap: 8px; text-align: center"><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #555555">Total Value</span><span style="font-size: 15px; font-weight: 700">$1,600,000</span></div><span style="font-size: 18px; font-weight: 700; color: #555555; padding-top: 14px">−</span><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #555555">Exemption</span><span style="font-size: 15px; font-weight: 700">$120,000</span></div><span style="font-size: 18px; font-weight: 700; color: #555555; padding-top: 14px">=</span><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #555555">Net Taxable</span><span style="font-size: 15px; font-weight: 700">$1,480,000</span></div></div>
<div style="text-align: center"><div style="font-size: 12px; color: #555555; margin-bottom: 4px">Applying tax rate</div><div style="font-size: 14px; line-height: 1.7">$1,480,000 ÷ $1,000 = $1,480 × $3.50</div></div>
</div>
<div style="background: #2c4a7a; color: #ffffff; text-align: center; padding: 12px; font-size: 17px; font-weight: 800">Taxes = $5,180</div>
</div>
<div style="flex: 1 1 300px; border: 1px solid #d6d6d6; display: flex; flex-direction: column">
<div style="background: #fbe7c6; padding: 10px 14px; font-weight: 800">Example 2: Without home exemption</div>
<table style="width: 100%; border-collapse: collapse; font-size: 14px">
<tr><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3">Total Assessed Value</td><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3; text-align: right">$1,600,000</td></tr>
<tr><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3">Home Exemption</td><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3; text-align: right">$0</td></tr>
<tr><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3">Classification</td><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3; text-align: right">Residential A</td></tr>
<tr><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3">Tier 1 (first $1M)</td><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3; text-align: right">$4.00 per $1,000 of net taxable</td></tr>
<tr><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3">Tier 2 (in excess of $1M)</td><td style="padding: 7px 14px; border-top: 1px solid #e3e3e3; text-align: right">$11.40 per $1,000 of net taxable</td></tr>
</table>
<div style="border-top: 1px solid #e3e3e3; padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; flex: 1">
<div style="display: flex; align-items: flex-start; justify-content: center; gap: 8px; text-align: center"><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #555555">Total Value</span><span style="font-size: 15px; font-weight: 700">$1,600,000</span></div><span style="font-size: 18px; font-weight: 700; color: #555555; padding-top: 14px">−</span><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #555555">Exemption</span><span style="font-size: 15px; font-weight: 700">$0</span></div><span style="font-size: 18px; font-weight: 700; color: #555555; padding-top: 14px">=</span><div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-size: 12px; color: #555555">Net Taxable</span><span style="font-size: 15px; font-weight: 700">$1,600,000</span></div></div>
<div style="text-align: center"><div style="font-size: 12px; color: #555555; margin-bottom: 4px">Applying tiered tax rates</div><div style="font-size: 14px; line-height: 1.7">$1,000,000 ÷ $1,000 = $1,000 × $4.00 = $4,000</div><div style="font-size: 14px; line-height: 1.7">$600,000 ÷ $1,000 = $600 × $11.40 = $6,840</div></div>
</div>
<div style="background: #2c4a7a; color: #ffffff; text-align: center; padding: 12px; font-size: 17px; font-weight: 800">Taxes = $4,000 + $6,840 = $10,840</div>
</div>
</div>
<p style="font-size: 13px; color: #555555; margin: 12px 0 0">Examples match the current Residential A page – confirm rates and exemption amount are still current before moving.</p>

<script>

    const titles = { faq: 'Frequently Asked Questions', codes: 'Examples of Property Records & Codes', videos: 'Informational Videos', guides: 'Informational Guides', brochures: 'Informational Brochures', laws: 'City Laws & Rules', resa: 'Residential A', bills: 'Property Tax Bills, Payments & Tax Credit', news: 'What’s New', act: 'Act 187' };
    const base = 'width: 100%; text-align: left; font: inherit; cursor: pointer; border: none; border-top: 1px solid #e3e3e3; min-height: 44px; font-size: 15px; ';
    const items = [
      { label: 'FAQ', v: 'faq' },
      { label: 'General', v: 'faq', fs: 'g', faqSub: true },
      { label: 'Ownership', v: 'faq', fs: 'o', faqSub: true },
      { label: 'Notice of Assessment', v: 'faq', fs: 'n', faqSub: true },
      { label: 'Tax Credit', v: 'faq', fs: 't', faqSub: true },

      { label: 'Valuation', v: 'faq', fs: 'v', faqSub: true },
      { label: 'Appeals', v: 'faq', fs: 'a', faqSub: true },
      { label: 'Home Exemption', v: 'faq', fs: 'h', faqSub: true },
      { label: 'Home Exemption – Military', v: 'faq', fs: 'm', faqSub: true },

      { label: 'City Laws & Rules', v: 'laws' },
      { label: 'What’s New', v: 'news' },

    ];
    const faqOpen = this.state.faqOpen === true;
    const menu = items.filter((it) => (!it.sub || this.state.guidesOpen) && (!it.faqSub || faqOpen)).map((it) => {
      const active = it.faqSub ? (view === 'faq' && this.state.faqSec === it.fs) : (it.v === view && !(it.v === 'faq' && this.state.faqSec));
      const pad = (it.sub || it.faqSub) ? 'padding: 9px 16px 9px 32px; font-size: 14px; ' : 'padding: 12px 16px; ';
      const look = active ? 'background: #e8eef6; color: #0b3b5c; font-weight: 700; border-left: 4px solid #2c4a7a; ' : 'background: #ffffff; color: #1c1c1c; border-left: 4px solid transparent; ';

      const g = it.faqSub ? () => this.setState({ view: 'faq', faqSec: it.fs, openQ: null }) : isF ? () => this.setState({ view: 'faq', faqSec: null, openQ: null, faqOpen: view === 'faq' && !this.state.faqSec ? !faqOpen : true }) : isG ? () => this.setState({ view: 'guides', openQ: null, lawTab: 'roh', guidesOpen: !this.state.guidesOpen }) : (it.v ? go(it.v) : () => {});

    const sec = (sid, name, count, qs) => ({ sid, name, count, qs: mk(sid, qs), more: count > qs.length, moreCount: count - qs.length });
    return {

      isFaq: view === 'faq', isCodes: view === 'codes', isVideos: view === 'videos', isGuides: view === 'guides', isBrochures: view === 'brochures', isLaws: view === 'laws', isResA: view === 'resa', isBills: view === 'bills', isNews: view === 'news', isAct: view === 'act',
      faq: [
        sec('g', 'General', 8, [{"q": "Are the City & County real property assessment records confidential?", "a": ["Except for certain personal information, such as taxpayer’s Social Security number, or telephone number, the real property assessment records are public records and the assessment information is available to the general public.", "Real property tax information is subject to public disclosure under the Uniform Information Practices Act (Modified), Chapter 92F (“UIPA”), Hawaii Revised Statutes (“HRS”), and is made available by the City for public inspection both in person and through the City’s real property tax website. This includes information regarding the name of the owner, address of the real property, assessed value, and consideration paid. Such public disclosure provides everyone the ability to ensure equal application of the law and the absence of special favors. Furthermore, the property tax system relies on an assessment process that includes notice and an opportunity to appeal. Access to these records is critical if there is to be a successful appeal since a comparison with comparable lots is often the best way to prove the case."]}, {"q": "What are my property taxes used for?", "a": ["The City and County of Honolulu’s real property tax is a major revenue source for police, fire protection, emergency services, water safety, parks, refuse and other essential City services."]}, {"q": "If the net taxable value for a parcel's assessment is $0, does that mean that I don't have to pay any property taxes?", "a": ["No, there is a $300 minimum real property tax. This means every parcel of taxable real property for which the computed tax amounts to less than $300 is liable for this minimum real property tax."]}, {"q": "I inherited a property from a family member, what do I need to do?", "a": ["Please report to the office in writing or by submitting a Change of Status Form BFS-RPA-M-8-10.1 that the family member has passed and update the mailing address if applicable. If you will be living in the property as your principal residence, file a Claim for Home Exemption Form BFS-RPA-E-8-10.3 with our office on or before September 30th."]}, {"q": "What forms does RPAD offer the option of online filing?", "a": ["RPAD currently offers the option of filing online for the following forms:", "• Claim for Home Exemption\n• Change of Status\n• Notice of Assessment Appeal to the Board of Review*", "*During the appeal filing period ONLY (December 15 to January 15 for the preceding tax year)"]}, {"q": "I just bought my first home and I don't remember what my escrow officer and realtor explained to me during closing. What do I need to know?", "a": ["Our Information Guide addresses the most common questions regarding", "• Important Dates\n• Locations\n• Website Addresses\n• Change in Status\n• Notice of Assessment\n• Exemptions\n• Forms\n• Continuance of a Home Exemption\n• Tax Bill Estimations\n• Property Tax Bills"]}, {"q": "How can I report a potential real property violation in my neighborhood?", "a": ["If you observe a potential real property violation in your neighborhood — such as construction without a building permit or an unregistered short-term rental — you can report it to the Department of Planning and Permitting by submitting a complaint through the following link: https://honolulu.my.site.com/s/new-rfi-application"]}, {"q": "How does USPS postmarking affect the deadline for mailed-in exemptions, dedications, or appeals?", "a": ["For any exemption, dedication, or appeal filing submitted by mail, the envelop must be postmarked on or before the applicable deadline to be considered timely.", "For Timely filing requirements, please refer to ROH §8-1.6.", "Effective Dec 24, 2025, the United States Postal Service (USPS) issued a clarification regarding postmarks and provides the following options as proof of mailing date.", "https://about.usps.com/what/strategic-plans/delivering-for-america/assets/service-standard-changes-faq-doc2-2025.pdf", "1. Automated Postmark (default): Applied by USPS machines at processing facilities; shows processing date. Please be aware that mail deposited in USPS collection boxes may not be postmarked on the same day it is collected by the carrier or dropped off at a Post Office.\n2. Manual (local) Postmark - by request: Free at a USPS retail counter, shows the exact date USPS accepted your mail.\n3. USPS Mailing Receipts: Certificate of mailing, Certified Mail, or Registered Mail, provides proof of acceptance.", "Taxpayers are responsible for ensuring their filings are postmarked by the applicable deadlines."]}]),
        sec('o', 'Ownership', 9, [{"q": "I got married in 2003, and in early 2004 my bank notified you of my name change. My Real Property Notice of Assessment still has my maiden name on it. How do I go about changing it?", "a": ["For Regular System properties send a copy of your marriage certificate with the Tax Map Key written on it to:", "City and County of Honolulu\nReal Property Assessment Division, Tax Maps Branch\n842 Bethel Street, Basement\nHonolulu, HI 96813", "For Land Court System properties, the name change must be recorded with the Land Court."]}, {"q": "How can I get a copy of my deed? I bought my home in 1989 and I have documents provided by my escrow company, but I can't find my deed.", "a": ["Please go to the State Bureau of Conveyances website, then click on Frequently Ask Questions."]}, {"q": "What form(s) do I need to fill out/submit to change the ownership name to just my name (since my mom passed away last year). Is there anything else I need to submit along with the form?", "a": ["You must probate your mother’s will with the court, and the court will issue an order to distribute the property. Please contact an attorney. After the will is probated, you should record it with the Land Court (State Bureau of Conveyances). You should also notify the land court that your mother is deceased."]}, {"q": "I was going through the website and wasn’t able to view any information with regards to mortgages and real estate notes that were created 1-5 yrs ago. How can I browse the site and search for deed trusts and mortgages that individuals have, or if there's any information on anyone who has sold their property some years back, and if the county clerk has records on the mortgage or trust deed that can be accessed through the website. I would be very pleased to get any information, particularly on recent home sales.", "a": ["Our website does not have the information you are interested in. Please visit the State of Hawaii’s Bureau of Conveyances Search Site.", "The site does not allow you to look at the actual document, but it does have an index that gives you recording information and cost.", "Our property search website has the document number for deeds under SALES HISTORY. However, we do not have any information on mortgages or trust agreements. The Bureau of Conveyances website and this website are under two different jurisdictions (State & County). If you are looking for comparable sales, the sales history link is the only thing our website has. There are private companies that have the type of information you’re looking for at a cost."]}, {"q": "Please direct me to the correct form to complete for an ownership change. I am on Hawaiian Homelands and was recently assigned the lease by my grandmother-in-law. I received the 2025 Real Property Notice of Assessment today in the mail and her name is still on it.", "a": ["Send us a copy of the corporate name change on regular system (State Bureau of Conveyances) properties and we will make the change for those properties. A list of tax map keys (from your notice of assessment) will be helpful. For those properties that are under the land court system, you will have to petition the Land Court (State Bureau of Conveyances) to have the name change on record and we should pick it up during our processing. We do miss some documents during our processing so if you have already recorded the name change, please include the document number of the recording. Address your inquiry to:", "City and County of Honolulu\nReal Property Assessment Division, Tax Maps Branch\n842 Bethel Street, Basement\nHonolulu, HI 96813"]}, {"q": "What are the steps I need to take to acquire TMK numbers for my newly created condominium property? Where is the website where I can download a TMK application form so I can fill out and file the application?", "a": ["Once your declaration for a CPR (Condominium Property Regime) is recorded at the State Bureau of Conveyances, we will assign Parcel ID numbers (TMKs) to the units. It usually takes about 2 months after the document is recorded. If we have not issued new TMKs at that time, you may contact us at the address below with your recording information.", "City and County of Honolulu\nReal Property Assessment Division, Tax Maps Branch\n842 Bethel Street, Basement\nHonolulu, HI 96813"]}, {"q": "How does a Hawaii corporation which owns real property and which changed its corporate name in 1983 go about notifying the Honolulu Real Property Assessment Division that the corporation is still receiving tax assessments under the old corporate name?", "a": ["Send us a copy of the corporate name change on regular system properties and we will make the change for those properties. A list of the tax map key numbers (TMKs), which you can get from your notice of assessment, will be helpful. For those properties that are under the land court system, you will have to petition the Land Court to have the name change on record and we should pick it up during our processing. We do miss some documents during our processing so if you have already recorded the name change, please include the document number of the recording."]}, {"q": "I talked to the surveyor who did a survey of my parcels of land which have only one TMK number. He suggested I get 2 separate TMK numbers before I start the permitting process to build. What do I need to do or whom do I speak with to get a TMK number for each lot?", "a": ["You must get a lot determination from the City and County of Honolulu’s Department of Planning and Permitting (DPP) and send us a written request for individual TMKs along with a copy of DPP's reply letter. Our address is:", "City and County of Honolulu\nReal Property Assessment Division, Tax Maps Branch\n842 Bethel Street, Basement\nHonolulu, HI 96813"]}, {"q": "We would like to transfer our property into a revocable living trust. In California we provide a copy of the trust abstract, file a quitclaim deed (available at the Tax Assessor counter) and pay a small filing fee - an attorney is not required.\nI contacted our Trust Attorney and learned they have not done any of these in Hawaii - something about forms, boxes and margins - and the need to have a Hawaii licensed Attorney.\n1. Is it true I need to use a Hawaii Licensed Attorney?\n2. Can I handle this myself at the Kapolei Office?\n3. Does your office have Quit Claim Deeds available for such transactions?\n4. Can you tell me what the filing fee is?\n5. Can you think of anything I overlooked?", "a": ["The questions you are asking should be asked of the State Bureau of Conveyances which has their contact information. The recording of documents is a State function and our office is a County agency dealing with real property assessments and ownership for real property assessment purposes.", "You do not have to come to our office, since, once a deed is recorded, we normally receive a copy about 1 month later and we take about a month to process it."]}]),
        sec('n', 'Notice of Assessment', 4, [{"q": "I inadvertently threw out my new property tax assessment which was just mailed to me. Could I have another one mailed to me?", "a": ["You can obtain the real property assessment information on our website, or a copy of the notice of assessment may be acquired from our office with payment of search and copy fees and a self-addressed stamped envelope mailed to our Honolulu or Kapolei offices. Checks should be made payable to the \"City and County of Honolulu\".", "Honolulu Office\n842 Bethel Street, Basement\nHonolulu, HI 96813\nPH: (808) 768-3799", "Kapolei Office\n1000 Uluʻōhiʻa Street, #206\nKapolei, HI 96707\nPH: (808) 768-3799"]}, {"q": "In December, I received a notice of assessment from your office, but I do not own the property anymore. What do I do?", "a": ["Our assessment is as of October 1, so if you sold the property after that date the new owner will not receive the notice of assessment for the property. Please write on the envelope \"RETURN TO SENDER - SOLD\" and drop the envelope in the mail."]}, {"q": "I’m under 1/10th ownership with others on a property, could each of us get an notice of assessment and tax bill mailed to us? Can the City & County of Honolulu do a pro-rata tax calculation for each of the owners?", "a": ["We can send a notice of assessment and tax bill to each owner that provides the City with their information. The City will not be responsible for pro-rating the tax bill. It is the owners’ responsibility to determine any allocation of the property tax bill."]}, {"q": "Why is the assessment value well above the price that I acquired a leasehold property?", "a": ["Real property is assessed in accordance with the Revised Ordinances of Honolulu (ROH). “Real property shall be assessed in its entirety to the owner...” ROH § 8-6.3, “In its entirety,” is interpreted as fee simple interest. \"All real property shall be subject to a tax upon 100 percent of its fair market value...\" ROH § 8-6.1."]}]),
        sec('t', 'Tax Credit', 1, [{"q": "How can I find out about the tax credit for homeowners?", "a": ["How to File: The instructions and Form T-RPT are available at the Treasury Division. You can also request the instructions and form by calling the telephone number listed below.", "Where To File:\nTax Relief Section\nDepartment of Budget and Fiscal Services\nTreasury Division\nP.O. Box 135028\nHonolulu, HI 96801-5028\nPH: (808) 768-3205"]}]),
        sec('c', 'Change of Address for Tax Bill or Notice of Assessment', 1, [{"q": "How do I change the mailing address for a real property tax bill or notice of assessment?", "a": ["The owner will need to submit a written request. The request should contain:", "• The parcel ID or TMK\n• The site address\n• The new mailing address\n• State that the address change is for the tax bill or notice of assessment or both\n• A phone number in case of questions\n• The reason for the change", "The Change of Status request form may be submitted by mail, or in person at either of the two real property assessment division’s locations. Or you may file to change the address for your notices of assessment online. Change of address for a tax bill cannot be made online."]}]),
        sec('v', 'Valuation', 3, [{"q": "How do you determine the value of properties?", "a": ["ROH § 8-7.1, the director of budget and fiscal services shall cause the fair market value of all taxable real property to be determined and annually assessed by the market data and cost approaches to value using appropriate systematic methods suitable for mass valuation of real property for ad valorem taxation purposes, so selected and applied to obtain, as far as possible, uniform and equalized assessments throughout the county.", "MARKET DATA APPROACH", "The market data approach is the process of deriving a value indication for the subject property by comparing similar properties that have recently sold with the property being appraised, identifying appropriate units of comparison, and making adjustments to the sale prices (or unit prices, as appropriate) of the comparable properties based on relevant, market-derived elements of comparison.", "The market data approach may be used to value improved properties, vacant land, or land being considered as though vacant when an adequate supply of comparable sales is available. RPAD uses techniques from the cost approach in determining land values for the market data approach.", "COST APPROACH", "The cost approach is based on the understanding that market participants relate value to cost.", "Building Value (RCNLD) + Land Value = Total Value by Cost Approach", "Building Value", "In the cost approach, the value of a property is derived by adding the estimated value of the land to Replacement Cost New Less Depreciation (RCNLD). RCNLD is the current cost of constructing a reproduction or replacement for the improvements and then subtracting the amount of depreciation in the improvements from all causes.", "Cost factors are currently determined by Marshall & Swift/Boeckh and applied to building information maintained by the appraiser. Depreciation calculated by the CAMA system is a function of the actual age, effective age, and expected life of the building. The City utilizes Honolulu-specific cost factors established by Marshall and Swift/Boeckh, which is a well-established and widely used third-party vendor in the building cost factor industry.", "Land Value", "Market data techniques are used to develop land values of the cost approach. Vacant land sales are preferred when available. In the absence of vacant land sales, the following is done:", "1. Subtract building values from each comparable/sale price.\n2. Apply adjustments to compensate for differences between comparables and a typical base lot for the subject neighborhood. Examples of adjustments may be made for location, height limitations, easements, and zoning.\n3. The most probable price for the subject’s land is considered after adjustments."]}, {"q": "What percent of market value are properties valued at?", "a": ["Properties are valued at 100% of market value."]}, {"q": "What is the difference between Mass Appraisal and Individual Appraisal?", "a": ["MASS APPRAISAL", "Mass appraisal is defined as the systematic appraisal of groups of properties as of a given date using standardized procedures and statistical testing. Sales data are analyzed and the appraisers make adjustments based on what buyers paid in the market. These adjustments are applied to the large populations of properties to estimate the value using a Computer Assisted Mass Appraisal (CAMA) system. RPAD follows the ROH to apply mass appraisal to value all properties for ad valorem taxation purposes to obtain uniform and equalized assessments throughout the county. RPAD appraisers have been continuously and actively trained by International Association of Assessing Officers (IAAO) instructors and its resources.", "INDIVIDUAL APPRAISAL", "Individual appraisals are done by a fee appraiser on a single property for purchasing, refinancing, or estate planning upon the lender’s or homeowner’s request. The appraiser typically selects three or more sales to estimate the value. These sales are analyzed and adjustments are made based on what buyers paid. The adjustments are manually applied to estimate the value of the property requested by the client. Fee appraisers typically follow different guidelines to perform their assignments and scope of work.", "MASS APPRAISAL VS. INDIVIDUAL APPRAISAL [table]", "Client/Intended Users — Mass: City and County of Honolulu · Individual: Lender, Homeowners\nPurpose — Mass: Valuation for Ad Valorem Taxation Purposes · Individual: Purchase, Refinancing, Estate, etc.\nEffective Date of Valuation — Mass: October 1st preceding the tax year · Individual: Inspection date, Date of death\nSubject of the Assignment — Mass: All taxable properties in the C&C of Honolulu · Individual: Client's requested subject property"]}]),
        sec('a', 'Appeals', 6, [{"q": "I properly submitted my appeal for this year’s property tax assessment. What can I do to help expedite my appeal process and support my appeal case?", "a": ["Scheduling of appeals is influenced by the number of appeals filed each year. To minimize your wait time for a Board of Review hearing, appellants are encouraged to submit their evidence and supporting documentation with their appeal or shortly thereafter. This will enable the assigned appraiser to review your assessment in a timely manner. If you are submitting evidence separately from the appeal form, please include your name, Parcel ID/TMK, year of the appeal, contact information such as a phone number, mailing address, and/or email address, and submit to either Real Property Assessment office.", "Types of documentation may include comparable fee simple market sales, contractor estimates to repair deficient items, and other evidence indicating the assessed value exceeds the fee simple market value by more than 10%.", "If your property is a leasehold property, while the leasehold value for your property may be lower than the assessed value, you should be aware that in accordance with the ROH, all properties in the County are required to be valued in their entirety. In other words, the assessed value reflects the fee simple value for the property. Taxes are required to be paid on the entire value of the property and while you are the owner of a partial interest in the property, for tax purposes you are considered to be the owner."]}, {"q": "Can I file my appeal via fax or email?", "a": ["No. An appeal cannot be lodged by facsimile transmission or via email."]}, {"q": "I have received a written decision from the Board of Review and I am not satisfied with their decision, what recourse do I have?", "a": ["The appellant has 30 days from the posted date of the Board of Review hearing decision to file an appeal to the Tax Appeal Court."]}, {"q": "Can I win an appeal based solely upon the annual increase of my property assessment value or the increase in the amount of my property taxes?", "a": ["No, ROH Article 8-12 provides four grounds for an appeal: (1) assessment of the property exceeds by more than 10 percent the market value of the property, or (2) lack of uniformity or inequality, brought about by illegality of the methods used or error in the application of the methods to the property involved, or (3) denial of an exemption to which the taxpayer is entitled and for which such person has qualified, or (4) illegality, on any ground arising under the Constitution or laws of the United States or the laws of the state or the ordinances of the city in addition to the ground of illegality of the methods used, mentioned in clause (2)."]}, {"q": "I appealed my property assessment and the Board of Review has reduced the assessment. Do I get my appeal deposit back?", "a": ["If a taxpayer's appeal to the boards of review is compromised or sustained as to any amount of the valuation in dispute, the costs deposited shall be returned to the appellant. Otherwise, the city shall retain the entire amount of costs deposited."]}, {"q": "I am trying to file an appeal online, but the system is not letting me proceed; what are my options?", "a": ["If this is a brand new development created in the last 12-18 months, the parcel may not be in our online database; download Form BFS-RPA-M-8-12, complete, print, and hand-deliver or mail along with the required payment and written signed authorization if applicable to the address below by the January 15 filing deadline.", "If this is not a brand-new development, the server may be experiencing technical issues. Please report this issue to our office by phone at 808-768-3799 during city business hours or email us at bfsrpmailbox@honolulu.gov to report the website malfunctioning. We recommend that you download Form BFS-RPA-M-8-12, complete, print, and hand-deliver or mail along with the required payment and written signed authorization, if applicable, to the address below by the January 15 filing deadline.", "Real Property Assessment Division\n842 Bethel St Basement\nHonolulu HI 96813", "• For timely filing requirements, please refer to ROH §8-1.6. Effective Dec 24, 2025, the United States Postal Service (USPS) issued a clarification regarding postmarks and provides the following options as proof of mailing date. https://about.usps.com/what/strategic-plans/delivering-for-america/assets/service-standard-changes-faq-doc2-2025.pdf", "1. Automated Postmark (default): Applied by USPS machines at processing facilities; shows processing date. Please be aware that mail deposited in USPS collection boxes may not be postmarked on the same day it is collected by the carrier or dropped off at a Post Office.\n2. Manual (local) Postmark - by request: Free at a USPS retail counter, shows the exact date USPS accepted your mail.\n3. USPS Mailing Receipts: Certificate of mailing, Certified Mail, or Registered Mail, provides proof of acceptance.", "• Taxpayers are responsible for ensuring their filings are postmarked by the applicable deadlines."]}]),
        sec('h', 'Home Exemption', 32, [{"q": "What is a home exemption?", "a": ["A home exemption is a form of tax relief that reduces the total assessed value of your property. By lowering the total assessed value on which the property tax is calculated, your overall real property tax liability is reduced. For example:", "Assessed Value $1,000,000 - Current Home Exemption (under age 65) $120,000 = Net Taxable Value $880,000.", "Assessed Value $1,000,000 - Current Home Exemption (age 65 and above) $160,000 = Net Taxable Value $840,000"]}, {"q": "What are the benefits of a home exemption?", "a": ["Filing for a home exemption is a one-time process that gives homeowners predictable, ongoing tax relief. Once allowed, you will not need to file again unless your situation changes (for example, if you sell, transfer ownership from individual to trust, or rent out your home). A home exemption may also qualify you for the Treasury Division’s Tax Credit Program. For more information, please contact the Treasury Division at 808-768-3980."]}, {"q": "What are the current home exemption amounts?", "a": ["The current home exemption amounts are $120,000 for owners under age 65 and $160,000 for owners age 65 and older.", "Effective in tax year 2027 (July 1, 2027 – June 30, 2028), the home exemption amounts will be $140,000 for owners under age 65 and $180,000 for owners age 65 and older.", "To qualify for the higher exemption amount, you must be 65 years of age on or before June 30 of the tax year, and your date of birth must be on record by September 30 preceding the tax year.", "Example: To receive the higher exemption amount of $160,000 in tax year 2026 (July 1, 2026 – June 30, 2027), you must be 65 as of June 30, 2026, and your date of birth must be on record by September 30, 2025.", "Please review your annual Notice of Assessment for the approved exemption amount, and contact the Real Property Assessment Division (\"RPAD\") if you have any questions."]}, {"q": "Are my taxes affected if I don’t have a home exemption?", "a": ["If you do not have a home exemption, your property may be subject to Residential A tax rates if its assessed value exceeds the Residential A threshold. For more information on Residential A tax rates, please visit: https://realproperty.honolulu.gov/help-resources/residential-a/"]}, {"q": "How do I qualify for a home exemption?", "a": ["To qualify for a home exemption in the City and County of Honolulu (“the City”), you must meet two requirements and file a claim:", "A. Ownership & Occupancy Requirement\n   (1) You must own and occupy the property as your principal home, with the intent to reside in the City as of the date of assessment (October 1).\n   (2) Evidence of intent to reside in the City may include, but is not limited to, the following indicia:\n      a. Occupying the home for more than 270 calendar days per year;\n      b. Registering to vote in the City;\n      c. Being stationed in the City under U.S. military orders; or\n      d. Filing a Hawaii State resident income tax return with an address in the City.", "B. Ownership Recordation Requirement\n   (1) Your ownership must be recorded with the Bureau of Conveyances, State of Hawaii, Department of Land and Natural Resources, on or before September 30 preceding the tax year for which you are claiming the exemption.\n   (2) If the property is leased, the lease must be for residential purposes for at least five years, and the lease must indicate that the lessee is responsible for paying all property taxes.", "C. Filing a Claim\n   (1) You must file a Home Exemption Claim (Form BFS-RP-E-8-10.3) with RPAD on or before September 30 preceding the tax year for which the exemption is claimed.\n   (2) If you file online, ensure that you receive an email confirmation after submission. If you do not receive one, please contact RPAD."]}, {"q": "Am I allowed more than one home exemption?", "a": ["No, only one home exemption is allowed per taxpayer, including but not limited to the State of Hawaii."]}, {"q": "Can my spouse and I receive a home exemption on multiple properties?", "a": ["Only one home exemption per married couple is granted if they live together. If spouses live separately and apart, they may each qualify for one-half of a home exemption on different properties."]}, {"q": "Can I claim a home exemption on a property held in a business name?", "a": ["No, properties held in a business or company name (e.g., LLCs) do not qualify for a home exemption."]}, {"q": "How do I submit a claim for a home exemption, and when is the deadline?", "a": ["Claims may be submitted by mail, online, or in person at any RPAD office. The deadline to submit a claim is September 30 preceding the tax year for which the exemption is claimed. For example, to claim an exemption for tax year 2026–2027 (July 1, 2026–June 30, 2027), a claim must be filed on or before September 30, 2025."]}, {"q": "When will my home exemption take effect if I filed a claim in January 2025? How do I know if my claim is approved?", "a": ["Because you filed in January 2025, after the September 30, 2024 deadline for tax year 2025–2026 (July 1, 2025–June 30, 2026), your exemption—if approved—will take effect in tax year 2026–2027, beginning on July 1, 2026.", "The Notice of Assessment for 2026, issued by December 15, 2025, will serve as notification of allowance or disallowance of your claim for a home exemption. Again, please check your exemption amount on the Notice of Assessment and contact RPAD if you have any questions."]}, {"q": "What if my home exemption is missing from my Notice of Assessment?", "a": ["A. Contact RPAD immediately.", "B. RPAD may require proof of occupancy, such as:\n   (1) Federal and State income tax returns.\n   (2) Utility statements (Electric, Gas, or Water) Provide two of the three from the prior year in which the exemption was removed.\n   (3) Ensure all documents are labeled with your Parcel ID/Tax Map Key, property address, and contact details."]}, {"q": "Why should I submit proof of date of birth when I file a claim for exemption?", "a": ["Providing proof of date of birth ensures that you automatically receive the higher exemption upon reaching age 65."]}, {"q": "I am 85 years old, but my Notice of Assessment only shows the basic home exemption instead of the higher exemption I should receive for my age. What should I do?", "a": ["To receive your age-related exemption:\n   (1) File a new home exemption form immediately;\n   (2) Submit proof of your date of birth; and\n   (3) Submit the form before September 30 to receive the higher exemption for next year.", "Unfortunately, we cannot apply the higher exemption retroactively."]}, {"q": "Do I need to notify RPAD if I sell or rent my home?", "a": ["Yes, you must notify RPAD within 30 days of selling or renting your home, or by November 1 of that year at the latest. To report this change:", "A. Submit a Change of Status Form online; or\nB. Submit the Change of Status Form M-8-2.1C by mail or in person; or\nC. Send a letter or email to RPAD.", "Failure to notify RPAD about these changes may result in a $300 penalty, plus additional rollback taxes under Revised Ordinances of Honolulu (“ROH”) § 8-10.1(d)."]}, {"q": "How is my home exemption affected if I rent my home?", "a": ["A. If you rent the entire home, you may no longer qualify for the exemption.", "B. If you rent a portion of your home, you may still qualify for a partial home exemption if you meet the criteria in FAQ #1."]}, {"q": "Can I receive a refund for past years if I did not claim a home exemption?", "a": ["No, refunds are not available for tax years prior to when the exemption takes effect."]}, {"q": "Do I need to notify RPAD if I change my mailing address?", "a": ["Yes, you must notify RPAD within 30 days of changing your mailing address, or by November 1 of that year at the latest.", "To report this change to RPAD either:", "A. Submit a Change of Status Form online; or\nB. Submit the Change of Status Form M-8-2.1C by mail or in person; or\nC. Send a letter or email to RPAD.", "Failure to notify RPAD of your mailing address change may affect the delivery of Notice of Assessment and Tax Bills, and could result in the removal of your home exemption."]}, {"q": "What if I want my notice of assessment or tax bill sent to someone else (such as my accountant, business manager, or family member)?", "a": ["You should use a \"care of\" (\"c/o\") designation. This means your mail will be addressed with \"c/o\" followed by the name of the person who will receive it on your behalf."]}, {"q": "If I move from one property to another, do I need to file a new home exemption?", "a": ["Yes, you need to file a new home exemption claim for your new property. Home exemptions are specific to each property and do not automatically transfer when you move."]}, {"q": "Can I keep my home exemption if I move to a licensed care facility or adult care home?", "a": ["Yes, you can keep your home exemption if you move to a care facility or adult residential care home licensed to operate in Hawaii, provided that you:", "A. Submit Form BFS-RP-E-8-10.3A (Relocation to Care Home or Facility) designating your care facility; and\nB. Do not rent, lease, or sell your home while residing in the care facility.", "This allows your property to continue receiving exemption benefits during the applicable period, even though you're not physically living in the home.", "This exemption continuation applies only to licensed care facilities in Hawaii, not to facilities in other states or living arrangements."]}, {"q": "Can I keep my home exemption when I move out during renovations?", "a": ["Yes, you can keep your home exemption when you move out for renovations, provided that you:", "A. Submit Form BFS-RP-E-8-10.3B (Notice of Temporary Relocation) by September 30 preceding the tax year in which the exemption is to continue;\nB. Complete renovations within two years from the permit start date;\nC. Submit Form BFS-RP-E-8-10.3C (Notice of Home Reoccupation) by September 30 of the year you reoccupy your home, along with Certificate of Occupancy, Notice of Completion, or closed permit; and\nD. Do not rent, lease, or sell your home during renovations."]}, {"q": "Can I keep my home exemption during a sabbatical or temporary work assignment?", "a": ["Yes, if you temporarily move outside the City for a sabbatical or work assignment, you may maintain your home exemption if you:", "A. Submit Form BFS-RP-E-8-10.3B (Notice of Temporary Relocation) within 30 days or by September 30 of the year your sabbatical begins;\nB. Keep your home unoccupied (not rented, leased, or sold);\nC. Return and reoccupy your home within 24 months of beginning your sabbatical or assignment; and\nD. Submit Form BFS-RP-E-8-10.3C (Notice of Home Reoccupation) within 30 days of reoccupation or by September 30 preceding the tax year in which the exemption is to continue, indicating the actual reoccupation date."]}, {"q": "Can I keep my home exemption if my house is damaged by fire?", "a": ["Yes, if your home becomes uninhabitable due to fire damage, you can maintain your exemption by following these steps:", "A. File Form BFS-RP-E-8-10.3B (Notice of Temporary Relocation) within 30 days of the fire or by September 30 preceding the tax year in which the exemption is to continue;\nB. Keep your damaged property unoccupied (do not rent, lease, or sell);\nC. Reoccupy your home within 24 months after the fire; and\nD. Submit Form BFS-RP-E-8-10.3C (Notice of Home Reoccupation) within 30 days of reoccupation or by September 30 preceding the tax year in which the exemption is to continue, indicating the actual reoccupation date."]}, {"q": "As a co-op owner, do I qualify for a home exemption?", "a": ["You may file a claim."]}, {"q": "What if a homeowner receiving an exemption passes away?", "a": ["Please contact RPAD within 30 days, or by November 1 of that year, to report the death of the owner. Check with RPAD to confirm that the exemption claim is still in effect after the owner’s passing.", "If a surviving titleholder or a beneficiary meets the criteria for a home exemption and no claim currently exists, any surviving titleholders or beneficiaries who occupy the property as their primary residence are encouraged to file a new home exemption claim to continue the exemption."]}, {"q": "I submitted a claim for a home exemption on February 1, 2025. The property search records indicate I am the owner and the property has a home exemption. Has my claim been approved?", "a": ["The home exemption currently shown online belongs to the previous owner. Since your claim was filed after the September 30, 2024 deadline for tax year 2025–2026, it will take effect for the tax year 2026–2027 (July 1, 2026–June 30, 2027).", "Your 2026 Notice of Assessment, which will be sent by December 15, 2025, will indicate whether your home exemption claim has been approved or disapproved.", "To ensure your home exemption claim is properly filed, please contact RPAD. The filing deadline for exemptions is September 30 of the year preceding the tax year."]}, {"q": "I am 42 years old and acquired/purchased a property with an assessed value greater than the Residential A threshold ($1,000,000) with a recordation date of November 3, 2024. This property did not have a home exemption and was in the Residential A class before I acquired it. I am living in the home and filed a home exemption claim on the same day of my purchase. Why is my property still in the Residential A class without a home exemption and required to pay higher taxes than I expected?", "a": ["Your recordation date occurred after the home exemption filing deadline of September 30 for the upcoming 2025–2026 tax year. The property will remain in the Residential A class for the current tax year and the upcoming tax year. See the illustration below:", "Home Exemption Filing Deadline → For Tax Year [table]\n9/30/2024 → 2025–2026 (July 1, 2025–June 30, 2026)\n9/30/2025 → 2026–2027 (July 1, 2026–June 30, 2027)\n9/30/2026 → 2027–2028 (July 1, 2027–June 30, 2028)", "Your home exemption claim, if approved, will take effect in tax year 2026–2027 beginning July 1, 2026. Your 2026 Notice of Assessment, which will be sent to you by December 15, 2025, will indicate whether your home exemption claim has been approved or disapproved. If your claim is approved, your 2026 Notice of Assessment will show your granted home exemption amount of $120,000 as a reduction to your taxable value. Your property will also be removed from the Residential A class and placed into the Residential class with the lower tax rate. As the new property owner, you still have the option to file a timely appeal by January 15, 2026, disputing your 2026 Notice of Assessment. For more information, please refer to ROH § 8-10.1.", "We encourage buyers (and their realtor) to verify whether the home they are about to purchase is currently vacant or being rented. Parties involved in a property acquisition can contact our office or visit our website to check if a property has a home exemption or if that exemption has been canceled. This is particularly important if the date of the property acquisition or the date of the sale is close to the home exemption deadline of September 30, and the property has an assessed value exceeding the Residential A threshold or is already classified as Residential A. This awareness should help prepare the buyer or new property owner(s) for any actions they might take to reduce, minimize, or account for the higher taxes without a home exemption.", "It may be in the best interest of the new homeowner to adjust, account for, and prepare their finances for the higher-than-expected real property taxes or to negotiate real property taxes into the sales price, escrow fees, and/or the proration of real property taxes during the closing process when acquiring a property.", "We understand that this situation may cause financial hardship on the new property owner(s); however, statutory deadlines are established for budgeting purposes by the City Administration and City Council, as they prepare and enact a balanced budget each year."]}, {"q": "What if the September 30 deadline falls on a weekend or legal holiday?", "a": ["If the September 30 deadline falls on a weekend or legal holiday, the deadline is extended to the next business day that is not a Saturday, Sunday, or legal holiday."]}, {"q": "I am having trouble filing a home exemption claim online. What should I do?", "a": ["A. If the property is in a new development (within the past 12 months, it may not yet appear in the online database.", "B. For technical issues or other difficulties, contact RPAD directly. You may also file the claim in person at any RPAD office, or mail your home exemption claim form with a self-addressed stamped envelop for a receipted copy."]}, {"q": "How do I confirm RPAD received my exemption claim?", "a": ["A. For mailed claims, provide a self-addressed stamped envelope for a receipted copy. Your claim is considered filed on the postal cancellation date.", "B. For online claims, a receipted copy is sent to the email provided. If you don't receive a confirmation email within 30 minutes of submission, please contact RPAD."]}, {"q": "If I buy a home with an existing exemption, does it transfer to me?", "a": ["No, the existing exemption will not transfer to you. You may be “grandfathered” into the existing home exemption for the current tax year if it is still in effect, but you will need to file a new claim for the next tax year."]}, {"q": "Should each owner-occupant file a home exemption?", "a": ["Yes, each owner-occupant should file an individual claim to ensure the property's exemption benefits are maintained without interruption, especially following the passing of a claimant or a change in the property's title."]}]),
        sec('m', 'Home Exemption – Military Personnel and Totally Disabled Veterans', 20, [{"q": "Can I keep my home exemption during my military deployment?", "a": ["Yes, if you're in the U.S. Armed Services and have received deployment orders, you can keep your home exemption while you're away. This benefit also applies during temporary relocation orders or training assignments."]}, {"q": "Can I rent out my home during deployment, training, or temporary relocation and keep the exemption?", "a": ["No, to qualify for continued home exemption during deployment, temporary relocation, or training, your property cannot be rented, leased, or sold during the period you are away. This applies regardless of the type of military assignment."]}, {"q": "Is there a time limit for my deployment to qualify?", "a": ["Yes, you must reoccupy your home within 24 months (two years) after your deployment begins to maintain your exemption."]}, {"q": "What if my deployment is extended beyond 24 months?", "a": ["If your deployment extends beyond 24 months, you may be at risk of losing your exemption. Contact your local property tax office as soon as possible to discuss your specific situation and potential options."]}, {"q": "Is this benefit only for active duty military?", "a": ["No, this benefit is for all U.S. Armed Services members with official deployment orders. Whether you are active duty, National Guard, or Reserve personnel, you qualify for continued home exemption during deployment."]}, {"q": "What if I'm deployed multiple times within the 24-month period?", "a": ["If you have multiple deployments within the 24-month period, you should notify RPAD and submit updated documentation for each deployment to ensure continuous exemption coverage."]}, {"q": "What does \"totally disabled\" mean for this exemption?", "a": ["It means you have a 100% disability rating from the U.S Department of Veterans Affairs (“VA”) for injuries that occurred while on active duty in the U.S. Armed Forces."]}, {"q": "What form do I need to file to claim an exemption for totally disabled veteran?", "a": ["File Form BFS-RP-E-8-10.5 (Claim for Home Exemption for Home of Totally Disabled Veteran) by personal delivery or by mail to any RPAD office."]}, {"q": "I just received a letter saying I'm 100% disabled, effective May 1, 2023. Can I get a refund for taxes I already paid?", "a": ["No, the exemption only starts with the next tax payment date after you file your claim. Past tax payments cannot be refunded based on a retroactive disability rating."]}, {"q": "My VA letter says I'm \"permanent and total.\" Does this qualify?", "a": ["Yes, a VA rating of permanent and total (P&T) disability meets the requirement for this exemption."]}, {"q": "When should I file my exemption claim?", "a": ["File as soon as possible. To receive the full year's exemption, file by August 19."]}, {"q": "What documents must I include with my claim?", "a": ["Please include:", "A. Certificate of disability from a licensed physician on the department's form;\nB. VA award letter showing 100% disability; and\nC. Marriage certificate (if filing as a spouse)"]}, {"q": "How will I know if my exemption is allowed?", "a": ["An amended Notice of Assessment will be mailed to your property address once the office has received confirmation from the U.S. Department of Veterans Affairs that you are recognized as 100% disabled. The general time frame is six to eight weeks from the date of filing."]}, {"q": "What is my property tax liability if I receive the 100% disabled veteran exemption?", "a": ["If you qualify for the 100% disabled veteran exemption, your property is exempt from all property taxes except for special assessments. However, a minimum real property tax of $300 per year is levied on each parcel of taxable real property. You would be responsible for this minimum tax, plus any special assessments that might apply to your property."]}, {"q": "My parents were receiving the 100% disabled veteran exemption. I inherited this property. Can I continue to receive the exemption?", "a": ["Unfortunately, the exemption does not carry over to children or other heirs who inherit the property."]}, {"q": "I have a totally disabled veteran’s exemption, and I just bought a new property. How do I move my exemption to this property?", "a": ["You need to file a new claim with RPAD. Make sure to clearly indicate which property you are claiming the veteran exemption for. If your new property is in another county, you must notify that county or state and terminate your current exemption before we can allow the exemption here. You must provide proof of termination from the other county or state."]}, {"q": "My disabled veteran spouse just died. What forms do I need to file?", "a": ["You need to file three important forms:", "A. Form BFS-RP-M-8-2.1C to report the death;\nB. Form BFS-RP-E-8-10.3 for the basic home exemption in your name; and\nC. Form BFS-RP-E-8-10.5 for the disabled veteran exemption in your name.", "You also need to include:", "A. Death certificate;\nB. Marriage certificate; and\nC. Proof of your spouse's 100% disability rating (if not already on file).", "File these forms as soon as possible to avoid any gap in your tax exemption."]}, {"q": "My veteran spouse never applied for the exemption before dying. Can I still get it?", "a": ["Yes, you can still apply if you can prove that your spouse would have qualified as 100% disabled at the time of death."]}, {"q": "My disabled veteran spouse just died. Can I sell my current home and transfer the disabled veteran exemption to a new house?", "a": ["No, the exemption only applies to the home your veteran spouse owned and lived in during his/her lifetime."]}, {"q": "I'm the spouse of a totally disabled veteran, my name is on the property title, and the property is my principal residence. Should I file the exemption claim?", "a": ["Yes, file Form BFS-RP-E-8-10.5 as soon as possible, and include your marriage certificate. Filing now ensures there is no interruption to the exemption benefits."]}]),
        sec('r', 'Affordable Rental Housing Project', 12, [{"q": "What is an Affordable Rental Housing (“ARH”) Project?", "a": ["An ARH provides rental units at below-market rates for low- and moderate-income households. These projects are supported by government programs, tax incentives, or subsidies to keep rents affordable. A variety of programs are available at both the state and city levels—please consult the appropriate agencies for more information."]}, {"q": "What types of affordable housing programs are available?", "a": ["Hawaii has several programs, including:", "a. Rental Housing Revolving Fund (“RHRF”)\nb. Rental Assistance Program (“RAP”)\nc. Dwelling Unit Revolving Fund (“DURF”)\nd. Affordable Rental Housing Program", "These programs are managed by the Hawaii Housing Finance & Development Corporation and the Hawaii Public Housing Authority. Please visit their websites for more information."]}, {"q": "What types of ARH projects are eligible for real property tax exemptions under the Revised Ordinances of Honolulu and other city or state provisions?", "a": ["There are currently four types of ARH projects eligible for real property tax exemptions under Revised Ordinance of Honolulu (“ROH”) § 8-10.33 and § 8-10.34:", "   a. ROH Chapter 29 projects\n   b. ROH § 21-9 Planned Development-Transit (“PD-T”) or Interim PD-T projects\n   c. Hawaii Revised Statutes (“HRS”) § 201H-36(a)(5) projects\n   d. ROH Chapter 32 projects (also known as “Bill 7” projects)", "Note: ROH Chapter 32 projects are subject to a Declaration of Restrictive Covenant while the others are subject to an Affordable Housing Agreement or a Regulatory Agreement."]}, {"q": "Can I apply for a real property tax exemption on an ARH project during construction? If yes, when is the deadline to apply?", "a": ["Yes, you can apply for an exemption during construction work for and marketing of an ARH project by filing a claim form with Real Property Assessment Division (“RPAD”) by September 30 before the first applicable tax year of the exemption. The exemption period is up to 3 years starting from the building permit issuance date and ending when a certificate of completion or certificate of occupancy (“COO”) is issued. For more information, please refer to ROH § 8-10.34."]}, {"q": "How do I apply for real property tax exemption for the affordable rental units after construction is complete, and what is the deadline to apply?", "a": ["You may file an initial claim form when the project is complete:", "a. If an initial claim form is filed and granted within 60 days after the issuance of a COO, the exemption will be effective as of the issuance date of a COO, if allowed.\nb. Otherwise, the exemption will be effective for the upcoming tax year if the claim is submitted by September 30 and allowed.\nc. If the claim form is submitted between October 1 and November 15, a late fee of $500 will be imposed."]}, {"q": "What happens after my initial filing for exemption for affordable rental units is allowed?", "a": ["To maintain the exemption during the affordability period, an annual claim, along with all required documentation, must be filed by September 30 for each applicable tax year. Submissions made between October 1 and November 15 will be subject to a $500 late penalty."]}, {"q": "If my affordable project covers multiple TMKs, do I need to file a claim for each TMK?", "a": ["Yes, a separate claim form must be filed for each TMK to qualify for an exemption. A joint development agreement is also required."]}, {"q": "What happens if there is an ownership change on the project during the exemption period?", "a": ["If any portion of the property receiving the exemption is sold or transferred during the exemption period, the exemption will be canceled. Consequently, the entire project—including both the sold portion and the portion still owned—will be subject to back taxes and penalties. However, taxes and penalties will not apply if the new owner submits a new exemption request within 30 days of the ownership change being officially recorded, and the claim is approved by the director."]}, {"q": "What is a Bill 7 Project?", "a": ["A Bill 7 project refers to a development initiative under Ordinance 19-8, enacted by the City and County of Honolulu in 2019. This ordinance, codified in ROH Chapter 32, aims to address the shortage of affordable rental housing by providing relaxed development standards and financial incentives for property owners and developers to construct low-rise, multi-family rental units on parcels up to 20,000 square feet. Governed by ROH Chapter 32, the Bill 7 program is one of four project types currently eligible for the City's real property tax exemption. For detailed requirements, please refer to ROH Chapter 32."]}, {"q": "What supporting documents are required for a Bill 7 project to claim exemption after the project construction is complete?", "a": ["a. An executed Declaration of Restrictive Covenant is required, which states that:\n   i. The affordability period must be a minimum of 15 years after the issuance of COO.\n   ii. The affordable units in the project must be rented at or below the rental rates set by the United States Department of Housing and Urban Development for households earning 80% of the AMI, based on household size.", "b. A copy of COO", "c. Supporting documents include unit numbers and rent rates, tenants' names, total household size and total household income."]}, {"q": "How long is the exemption period for Bill 7 Projects?", "a": ["The exemption period is 15 years, starting from the issuance date of COO, and ending on June 30 of the last year of the fifteen-year period."]}, {"q": "If I want to build a Bill 7 housing project, what do I need to do to get an exemption allowance?", "a": ["You may file a claim form for exemption when the project is being built. If allowed, the exemption period for qualifying construction is 3 years. You may file an initial claim for affordable units when the project is complete. After your initial claim is allowed, you must file an annual claim and certify the project continues to be in compliance for continued exemption each year during the exemption period.", "If a Bill 7 project does not comply with the signed DRC within five years after the exemption for qualifying construction ends, the exemption will be retroactively canceled, and the taxpayer will be required to repay the full amount to the City in accordance with ROH § 8-10.34(f)."]}])
      ].filter((x) => !this.state.faqSec || x.sid === this.state.faqSec),
