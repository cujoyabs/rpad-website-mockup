<div style="line-height: 1.1"><div style="font-size: 10px; letter-spacing: 1px">CITY AND COUNTY OF</div><div style="font-size: 18px; font-weight: 800">HONOLULU</div></div>
</div>
<nav aria-label="Main menu" style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px; font-weight: 600">

<section class="d-banner" style="color: #ffffff">
<div style="max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: flex; align-items: center; gap: 16px">
<img src="img/250bc961682ebb096452e7fce7a9e114.png" alt="" style="width: 72px; height: 72px; object-fit: contain">
<div>
<div style="font-size: 13px; font-weight: 700; letter-spacing: 1px">REAL PROPERTY ASSESSMENT DIVISION · CONTACT US</div>
<h1 style="font-size: 34px; font-weight: 800; margin: 4px 0 0">Contact Us</h1>
</div>

<a href="index.html">Home</a> › Contact Us

<main style="max-width: 1200px; margin: 0 auto; padding: 20px 24px 48px; display: flex; flex-wrap: wrap; gap: 36px; align-items: flex-start">

<aside style="flex: 1 1 220px; max-width: 280px; display: flex; flex-direction: column; gap: 18px">

<div style="border: 1px solid #d6d6d6; padding: 16px">
<h3 style="font-size: 17px; font-weight: 800; color: #0b3b5c; margin: 0 0 8px">Phone</h3>
<div style="font-size: 22px; font-weight: 800">(808) 768-3799</div>
<h3 style="font-size: 17px; font-weight: 800; color: #0b3b5c; margin: 16px 0 8px">Email</h3>
<a href="#" style="font-size: 15px; font-weight: 700">bfsrpmailbox@honolulu.gov</a>
</div>
<div id="offices" style="background: #f2f2f2; padding: 16px">
<h3 style="font-size: 17px; font-weight: 800; color: #0b3b5c; margin: 0 0 6px">Honolulu Office</h3>
<div style="font-size: 15px; line-height: 1.6">842 Bethel Street, Basement<br>Honolulu, HI 96813</div>
<div style="font-size: 14px; margin-top: 8px; line-height: 1.6"><strong>Hours:</strong> Mon – Fri, [__:__ a.m. – __:__ p.m.]<br><strong>Closed on State-observed holidays</strong></div>
<a href="#" style="font-size: 14px; display: inline-block; margin-top: 6px">Get directions</a>
</div>
<div style="background: #f2f2f2; padding: 16px">
<h3 style="font-size: 17px; font-weight: 800; color: #0b3b5c; margin: 0 0 6px">Kapolei Office</h3>
<div style="font-size: 15px; line-height: 1.6">1000 Uluʻōhiʻa Street, #206<br>Kapolei, HI 96707</div>
<div style="font-size: 14px; margin-top: 8px; line-height: 1.6"><strong>Hours:</strong> Mon – Fri, [__:__ a.m. – __:__ p.m.]<br><strong>Closed on State-observed holidays</strong></div>
<a href="#" style="font-size: 14px; display: inline-block; margin-top: 6px">Get directions</a>
</div>
<div style="background: #fbf6ea; border-left: 4px solid #c9962b; padding: 14px 16px; font-size: 14px; line-height: 1.6">
Questions about paying your property tax bill? Contact the <strong>Treasury Division</strong>.<br><a href="#" style="display: inline-block; margin-top: 8px; font-weight: 700; background: #2c4a7a; color: #ffffff; text-decoration: none; padding: 10px 16px">Go to the Treasury Division site ↗</a>
</div>

</aside>
<section style="flex: 999 1 520px; min-width: 0">
<h2 style="font-size: 26px; font-weight: 800; color: #0b3b5c; margin: 0 0 10px">How can we help?</h2>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 8px">We're here to help with questions about property assessments, exemptions, appeals, property records and mailing address changes. Send us a message and RPAD staff will reply by email.</p>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 22px">If your question is about a specific property, please include its <strong>TMK (parcel ID)</strong>.</p>

<h3 style="font-size: 19px; font-weight: 800; color: #0b3b5c; margin: 0 0 14px">Send us a message</h3>
<form style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px">
<label for="first" style="font-size: 14px; font-weight: 700">First name <span style="color: #b3261e">*</span></label>
<input id="first" type="text" style="font: inherit; font-size: 15px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; border: 1px solid #8a8a8a">
</div>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px">
<label for="last" style="font-size: 14px; font-weight: 700">Last name <span style="color: #b3261e">*</span></label>
<input id="last" type="text" style="font: inherit; font-size: 15px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; border: 1px solid #8a8a8a">
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px">
<label for="email" style="font-size: 14px; font-weight: 700">Email <span style="color: #b3261e">*</span></label>
<input id="email" type="email" style="font: inherit; font-size: 15px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; border: 1px solid #8a8a8a">
</div>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px">
<label for="phone" style="font-size: 14px; font-weight: 700">Daytime phone</label>
<input id="phone" type="tel" style="font: inherit; font-size: 15px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; border: 1px solid #8a8a8a">
</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px">
<label for="topic" style="font-size: 14px; font-weight: 700">Topic <span style="color: #b3261e">*</span></label>
<select id="topic" style="font: inherit; font-size: 15px; padding: 10px 12px; min-height: 44px; border: 1px solid #8a8a8a; background: #ffffff">
<option>Choose a topic</option>
<option>Appeals</option>
<option>Exemptions / Home Exemption</option>
<option>My assessment or Notice of Assessment</option>
<option>Change of mailing address</option>
<option>Property records</option>
<option>Statewide reports</option>
<option>Website problem</option>
<option>Other</option>
</select>
</div>
<div style="flex: 1 1 200px; display: flex; flex-direction: column; gap: 6px">
<label for="tmk" style="font-size: 14px; font-weight: 700">TMK (parcel ID), if any</label>
<input id="tmk" type="text" style="font: inherit; font-size: 15px; padding: 10px 12px; min-height: 44px; box-sizing: border-box; border: 1px solid #8a8a8a">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="msg" style="font-size: 14px; font-weight: 700">Message <span style="color: #b3261e">*</span></label>
<textarea id="msg" rows="6" style="font: inherit; font-size: 15px; padding: 10px 12px; box-sizing: border-box; border: 1px solid #8a8a8a; resize: vertical"></textarea>
</div>
<div style="width: 300px; max-width: 100%; box-sizing: border-box; height: 74px; border: 1px solid #d3d3d3; border-radius: 3px; background: #f9f9f9; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; box-shadow: 0 1px 2px rgba(0,0,0,0.08)">
<label style="display: flex; align-items: center; gap: 12px; font-size: 14px; color: #222222"><input type="checkbox" style="width: 24px; height: 24px; margin: 0">I'm not a robot</label>
<span style="font-size: 10px; color: #555555; text-align: center; line-height: 1.3">reCAPTCHA<br>(added by DIT)</span>
</div>
<div style="font-size: 13px; color: #555555"><span style="color: #b3261e">*</span> Required. Please don't include Social Security or bank account numbers.</div>
<button type="button" style="align-self: flex-start; font: inherit; font-size: 15px; font-weight: 700; background: #2c4a7a; color: #ffffff; border: none; padding: 12px 28px; min-height: 44px; cursor: pointer">Submit</button>
</form>
