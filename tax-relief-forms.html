</style>
</head>

<div style="display: flex; align-items: center; gap: 10px">

<nav aria-label="Main menu" style="display: flex; flex-wrap: wrap; gap: 20px; font-size: 14px; font-weight: 600">

<section class="d-banner" style="color: #ffffff">

<div style="font-size: 13px; font-weight: 700; letter-spacing: 1px">REAL PROPERTY ASSESSMENT DIVISION · TAX RELIEF &amp; FORMS</div>

</div>
</div>
</section>

<div style="max-width: 1200px; margin: 0 auto; padding: 16px 24px 0; font-size: 13px; color: #555555">

<aside style="flex: 1 1 220px; max-width: 280px; display: flex; flex-direction: column; gap: 18px">
<nav aria-label="Tax Relief and Forms pages" style="border: 1px solid #d6d6d6; display: flex; flex-direction: column">
<button type="button" onClick="{{goMain}}" aria-current="{{mainCurrent}}" style="{{menuHeadStyle}}">Tax Relief &amp; Forms</button>

<button type="button" onClick="{{m.go}}" aria-expanded="{{m.expanded}}" style="{{m.style}}">{{m.label}}</button>

<div style="background: #f2f2f2; padding: 16px">

<div style="font-size: 14px; line-height: 1.7"><strong>Sep 30</strong> – Home exemption claims due (approved claims take effect the following tax year)<br><strong>Jul 1, 2027</strong> – New home exemption amounts take effect<br><span style="color: #666666">[Add dedication deadlines]</span></div>
</div>
<div style="background: #f2f2f2; padding: 16px">
<div style="font-size: 15px; font-weight: 800; margin-bottom: 10px">Popular forms</div>
<a href="#" style="display: block; font-size: 14px; padding: 4px 0">Home Exemption Form E-8-10.3 (PDF)</a>
<a href="#" style="display: block; font-size: 14px; padding: 4px 0">Change of Status Form M-8-2.1C (PDF)</a>

<main style="flex: 999 1 560px; min-width: 0">
<div style="font-size: 13px; color: #555555">{{kicker}}</div>
<h1 style="font-size: 30px; font-weight: 800; color: #0b3b5c; margin: 4px 0 16px">{{title}}</h1>

<!-- LANDING -->
<!--sc-if value="{{isMain}}" hint-placeholder-val="{{ true }}"-->
<p style="font-size: 16px; line-height: 1.7; margin: 0 0 14px; max-width: 760px"><strong>Tax relief programs</strong> offer a reduction in property taxes due to various qualified exemptions and dedications. Choose a program type below.</p>
<!--sc-if value="{{showSummary}}" hint-placeholder-val="{{ true }}"-->
<div style="background: #f2f2f2; padding: 16px 20px; margin: 0 0 26px; max-width: 760px">
<div style="font-size: 15px; font-weight: 800; color: #0b3b5c; margin-bottom: 8px">Summary</div>
<ul style="margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.7">
<li><strong>Exemptions</strong> lower the taxable value of your property (for example, the home exemption for an owner-occupied home).</li>
<li><strong>Dedications</strong> lower your taxes when you commit your land to a use (agriculture, residential use, long-term rental) for a set number of years.</li>
<li><strong>Affordable Housing</strong> and <strong>Miscellaneous Forms</strong> cover rental housing projects, address/status changes, disaster remission and Enterprise Zones.</li>
</ul>
</div>
<!--/sc-if-->

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px">
<!--sc-for list="{{groupCards}}" as="g" hint-placeholder-count="4"-->
<button type="button" class="tr-card" onClick="{{g.go}}" style="text-align: left; font: inherit; color: #1c1c1c; background: #ffffff; border: 1px solid #d5dde8; border-top: 5px solid #2c4a7a; padding: 20px; cursor: pointer; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 19px; font-weight: 800; color: #0b3b5c">{{g.label}}</span>
<span style="font-size: 14px; line-height: 1.6">{{g.desc}}</span>
<span style="font-size: 13px; color: #555555">{{g.count}}</span>
<span style="font-size: 14px; font-weight: 700; color: #1f4f8a; margin-top: 4px">See {{g.short}} »</span>
</button>
<!--/sc-for-->
</div>

<div style="margin-top: 30px; padding: 16px 20px; border-left: 4px solid #2c4a7a; background: #eef3f9; font-size: 15px; line-height: 1.6; max-width: 760px">
<strong>Deadline:</strong> Home exemption claims submitted by <strong>September 30</strong> and approved take effect in the following tax year. [Add other key deadlines – e.g., dedication petitions – confirm dates.]
</div>
<!--/sc-if-->

<!-- GROUP OVERVIEW -->
<!--sc-if value="{{isGroup}}" hint-placeholder-val="{{ false }}"-->
<!--sc-if value="{{groupHead}}" hint-placeholder-val="{{ false }}"-->
<h2 style="font-size: 18px; font-weight: 800; color: #2c4a7a; margin: 0 0 8px">{{groupHead}}</h2>
<!--/sc-if-->
<p style="font-size: 16px; line-height: 1.7; margin: 0 0 12px; max-width: 760px">{{groupDesc}}</p>
<!--sc-if value="{{groupExtra}}" hint-placeholder-val="{{ false }}"-->
<p style="font-size: 16px; line-height: 1.7; margin: 0 0 12px; max-width: 760px">{{groupExtra}}</p>
<!--/sc-if-->
<div style="display: flex; flex-wrap: wrap; gap: 8px 20px; margin: 0 0 22px">
<!--sc-for list="{{groupLaws}}" as="gl" hint-placeholder-count="0"-->
<a href="#" style="display: inline-flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 700; text-decoration: none"><span style="font-size: 10px; font-weight: 800; padding: 3px 5px; color: #ffffff; background: #2c4a7a">ROH</span>{{gl}}</a>
<!--/sc-for-->
</div>
<!--sc-for list="{{groupSections}}" as="s" hint-placeholder-count="2"-->
<section style="margin-bottom: 26px">
<!--sc-if value="{{s.heading}}" hint-placeholder-val="{{ true }}"-->
<h2 style="font-size: 18px; font-weight: 800; color: #2c4a7a; margin: 0 0 6px">{{s.heading}}</h2>
<!--/sc-if-->
<div style="border-top: 1px solid #d9d9d9">
<!--sc-for list="{{s.items}}" as="it" hint-placeholder-count="4"-->
<button type="button" class="tr-row" onClick="{{it.go}}" style="width: 100%; text-align: left; font: inherit; background: none; border: none; border-bottom: 1px solid #d9d9d9; padding: 12px 6px; min-height: 48px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px">
<span style="font-size: 15px; font-weight: 700; color: #1f4f8a">{{it.label}}</span>
<span style="flex: none; font-size: 13px; color: #555555">{{it.form}}  ›</span>
</button>
<!--/sc-for-->
</div>
</section>
<!--/sc-for-->
<!--sc-if value="{{groupCallout}}" hint-placeholder-val="{{ false }}"-->
<div style="border-left: 4px solid #2c4a7a; background: #eef3f9; padding: 16px 20px; margin-top: 8px; max-width: 760px; font-size: 15px; line-height: 1.6">
<strong>{{groupCallout}}</strong><br><a href="#" style="font-weight: 700">Go to DPP Affordable Housing ↗</a> <span style="font-size: 13px; color: #555555">(honolulu.gov/dpp/planning/affordable-housing)</span>
</div>
<!--/sc-if-->
<!--sc-if value="{{groupDisclaimer}}" hint-placeholder-val="{{ false }}"-->
<div style="background: #f6ecdf; border: 1px solid #e6d4bd; padding: 16px 20px; margin-top: 8px; max-width: 760px">
<div style="font-size: 14px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 6px">LEGAL DISCLAIMER</div>
<p style="margin: 0; font-size: 14px; line-height: 1.6">{{groupDisclaimer}}</p>
</div>
<!--/sc-if-->
<!--/sc-if-->

<!-- DETAIL PAGE -->
<!--sc-if value="{{isDetail}}" hint-placeholder-val="{{ false }}"-->
<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
<div style="flex: 999 1 420px; min-width: 0">
<!--sc-if value="{{d.onlineBtn}}" hint-placeholder-val="{{ true }}"-->
<a href="#" style="display: inline-block; font-size: 15px; font-weight: 700; background: #2c4a7a; color: #ffffff; text-decoration: none; padding: 13px 22px; margin-bottom: 20px">{{d.onlineLabel}} »</a>
<!--/sc-if-->
<!--sc-if value="{{d.onlineCard}}" hint-placeholder-val="{{ false }}"-->
<a href="#" class="tr-card" style="display: flex; flex-direction: column; gap: 6px; max-width: 320px; text-decoration: none; color: #1c1c1c; border: 1px solid #d5dde8; border-top: 5px solid #2c4a7a; padding: 14px 16px; margin-bottom: 20px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.5px; color: #555555">ONLINE FORM</span>
<span style="font-size: 16px; font-weight: 800; color: #0b3b5c">{{d.onlineLabel}}</span>
<span style="font-size: 13px; font-weight: 700; color: #1f4f8a">File online »</span>
</a>
<!--/sc-if-->
<!--sc-for list="{{d.links}}" as="lk" hint-placeholder-count="1"-->
<p style="margin: 0 0 14px"><a href="#" style="display: inline-flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 700"><!--sc-if value="{{lk.hasTag}}" hint-placeholder-val="{{ true }}"--><span style="{{lk.tagStyle}}">{{lk.tag}}</span><!--/sc-if-->{{lk.t}}</a></p>
<!--/sc-for-->
<!--sc-if value="{{d.noDesc}}" hint-placeholder-val="{{ false }}"-->
<div style="border: 2px dashed #b8c6d9; background: #f7f9fc; padding: 14px 16px; font-size: 14px; line-height: 1.6; margin-bottom: 14px">[No description on the current page – suggest adding 1–2 sentences on who qualifies and what the dedication does (e.g., from the brochure).]</div>
<!--/sc-if-->
<!--sc-if value="{{d.hasChoices}}" hint-placeholder-val="{{ false }}"-->
<div style="font-size: 15px; font-weight: 800; color: #0b3b5c; margin: 0 0 10px">What do you need to change? File online:</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px">
<!--sc-for list="{{d.choices}}" as="ch" hint-placeholder-count="3"-->
<a href="#" class="tr-card" style="display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: #1c1c1c; border: 1px solid #d5dde8; border-top: 5px solid #2c4a7a; padding: 14px 16px">
<span style="font-size: 16px; font-weight: 800; color: #0b3b5c">{{ch.t}}</span>
<span style="font-size: 13px; font-weight: 700; color: #1f4f8a; margin-top: auto">File online »</span>
</a>
<!--/sc-for-->
</div>
<!--/sc-if-->
<!--sc-if value="{{rohOpen}}" hint-placeholder-val="{{ false }}"-->
<section aria-label="Ordinance text" style="border: 1px solid #b8c6d9; border-top: 5px solid #2c4a7a; background: #ffffff; margin: 0 0 22px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; background: #eef3f9; padding: 12px 16px">
<div><span style="font-size: 10px; font-weight: 800; padding: 3px 5px; color: #ffffff; background: #2c4a7a">ROH</span> <strong style="font-size: 15px; color: #0b3b5c">{{rohTitle}}</strong></div>
<button type="button" onClick="{{closeRoh}}" style="font: inherit; font-size: 14px; font-weight: 700; background: #ffffff; color: #0b3b5c; border: 1px solid #2c4a7a; padding: 8px 14px; min-height: 40px; cursor: pointer">Close ✕</button>
</div>
<div style="padding: 16px; font-size: 14px; line-height: 1.7; max-height: 260px; overflow-y: auto">
<p style="margin: 0 0 10px">[The ordinance text shows here, inside our page, so people don't leave the RPAD site. DIT to confirm: embed from the City Clerk / Municode ROH, or copy the section text onto the page.]</p>
<p style="margin: 0; color: #555555">Sec. … (a) … (b) … (c) …</p>
</div>
<div style="padding: 10px 16px; border-top: 1px solid #e3e3e3; font-size: 13px"><a href="#">Open the full Revised Ordinances of Honolulu ↗</a></div>
</section>
<!--/sc-if-->
<!--sc-if value="{{d.sub}}" hint-placeholder-val="{{ false }}"-->
<h2 style="font-size: 18px; font-weight: 800; color: #2c4a7a; margin: 0 0 8px">{{d.sub}}</h2>
<!--/sc-if-->
<!--sc-for list="{{d.paras}}" as="p" hint-placeholder-count="3"-->
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 12px">{{p}}</p>
<!--/sc-for-->
<!--sc-if value="{{d.howTo}}" hint-placeholder-val="{{ true }}"-->
<p style="font-size: 15px; line-height: 1.7; margin: 14px 0 0; font-weight: 700">{{d.howTo}}</p>
<!--/sc-if-->
<!--sc-if value="{{d.learn}}" hint-placeholder-val="{{ false }}"-->
<p style="font-size: 15px; margin: 14px 0 0"><a href="help-resources.html" style="font-weight: 700">Learn more about home exemptions (FAQ) »</a></p>
<!--/sc-if-->
</div>

<aside style="flex: 1 1 260px; max-width: 320px; display: flex; flex-direction: column; gap: 18px">
<!--sc-if value="{{d.hasFacts}}" hint-placeholder-val="{{ true }}"-->
<div style="background: #eef3f9; border-top: 4px solid #2c4a7a; padding: 16px 18px">
<div style="font-size: 13px; font-weight: 800; letter-spacing: 0.5px; color: #0b3b5c; margin-bottom: 8px">AT A GLANCE</div>
<!--sc-for list="{{d.facts}}" as="f" hint-placeholder-count="3"-->
<div style="padding: 7px 0; border-bottom: 1px solid #d5dde8"><div style="font-size: 12px; color: #555555">{{f.k}}</div><div style="font-size: 15px; font-weight: 700">{{f.v}}</div></div>
<!--/sc-for-->
</div>
<!--/sc-if-->
<div style="border: 1px solid #d5dde8; padding: 16px 18px">
<div style="font-size: 13px; font-weight: 800; letter-spacing: 0.5px; color: #0b3b5c; margin-bottom: 6px">FORMS &amp; DOCUMENTS</div>
<!--sc-for list="{{d.docs}}" as="doc" hint-placeholder-count="3"-->
<a href="#" onClick="{{doc.open}}" style="display: flex; gap: 10px; align-items: flex-start; padding: 9px 0; border-bottom: 1px solid #ececec; text-decoration: none; color: #1c1c1c">
<span style="{{doc.tagStyle}}">{{doc.tag}}</span>
<span style="font-size: 14px; font-weight: 600; line-height: 1.4">{{doc.label}}</span>
</a>
<!--/sc-for-->
<div style="font-size: 11px; color: #555555; margin-top: 10px; line-height: 1.6">PDF = opens a PDF · ROH = City ordinance · WEB ↗ = another website</div>
</div>
</aside>
</div>
<!--/sc-if-->

<!-- EXEMPTION FORMS: searchable table -->

<p style="font-size: 15px; line-height: 1.6; margin: 0 0 16px; max-width: 760px">{{formIntro}}</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px">
<label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700">Search
<input type="search" value="{{formQ}}" onInput="{{setFormQ}}" placeholder="Form number or keyword" style="font: inherit; font-size: 15px; font-weight: 400; padding: 9px 12px; min-height: 42px; border: 1px solid #999999; width: 260px; max-width: 60vw">
</label>
<div style="font-size: 13px; color: #555555">Showing {{formCount}} of {{formTotal}} forms</div>
</div>
<!--sc-for list="{{formGroups}}" as="fg" hint-placeholder-count="2"-->
<!--sc-if value="{{fg.show}}" hint-placeholder-val="{{ true }}"-->
<h2 style="font-size: 18px; font-weight: 800; color: #2c4a7a; margin: 18px 0 4px">{{fg.head}}</h2>
<div style="font-size: 13px; color: #555555; margin: 0 0 8px">{{fg.sub}}</div>
<div style="overflow-x: auto">

<tr style="{{f.rowStyle}}">

<td style="padding: 10px 12px; line-height: 1.45">{{f.desc}}</td>
<td style="padding: 10px 12px"><a href="#" style="display: inline-flex; gap: 6px; align-items: center; font-weight: 700; text-decoration: none"><span style="font-size: 10px; font-weight: 800; padding: 2px 5px; color: #2c4a7a; background: #ffffff; border: 1px solid #2c4a7a">PDF</span>Download</a></td>
</tr>
<!--/sc-for-->
</tbody>
</table>
</div>
<!--/sc-if-->
<!--/sc-for-->
<!--sc-if value="{{noForms}}" hint-placeholder-val="{{ false }}"-->
<p style="font-size: 15px; padding: 14px 4px; margin: 0">No forms match “{{formQ}}”.</p>
<!--/sc-if-->
<!--sc-if value="{{isXf}}" hint-placeholder-val="{{ true }}"-->
<p style="font-size: 13px; color: #555555; margin: 14px 0 0">** [Footnote – the current page marks two forms with ** but doesn’t say what it means. Add the explanation or remove the marks.]</p>
<!--/sc-if-->
<!--/sc-if-->

<!-- EXEMPTION FAQ = link to FAQ anchor -->
<!--sc-if value="{{isFaqLink}}" hint-placeholder-val="{{ false }}"-->
<div style="border: 1px solid #d5dde8; border-left: 5px solid #2c4a7a; background: #eef3f9; padding: 20px 22px; max-width: 760px">
<div style="font-size: 13px; font-weight: 800; letter-spacing: 0.5px; color: #0b3b5c; margin-bottom: 6px">THIS MENU ITEM IS A LINK, NOT A PAGE</div>
<p style="font-size: 15px; line-height: 1.7; margin: 0 0 14px">On the live site, clicking <strong>{{faqItem}}</strong> jumps straight to <strong>Help &amp; Resources › FAQ</strong>, scrolled to the <strong>{{faqSection}}</strong> section{{faqToday}}. The answers live in one place, the FAQ, so they never have to be updated twice.</p>
<a href="help-resources.html" style="display: inline-block; font-size: 15px; font-weight: 700; background: #2c4a7a; color: #ffffff; text-decoration: none; padding: 12px 20px">Go to FAQ – {{faqSection}} section »</a>
</div>

<script>

    const groups = {
      ex: { label: 'Exemptions', short: 'exemptions', laws: ['Revised Ordinances of Honolulu 8-10'], head: 'Purpose', purpose: 'To assist Oahu property owners seeking information on home exemptions and other common tax relief programs. It explains how to qualify for exemptions which reduce the net taxable assessed value of the property used in determining the property tax.', disclaimer: 'The Real Property Assessment Division (RPAD) provides general information regarding real property tax assessments. RPAD does not give legal or other professional advice, and persons with specific inquiries regarding ownership, real property tax law and the appraisal process are urged to consult with an attorney or appropriate professional. Mahalo.', desc: 'Reduces the valuation on which taxes are computed by decreasing the real property tax base and lessening the real property tax liability for the taxpayer.',

          { heading: 'For homeowners', items: [['home', 'Home Exemption', 'E-8-10.3'], ['vet', 'Totally Disabled Veterans', 'E-8-10.5'], ['lep', 'Persons Affected with Leprosy', 'E-8-10.6'], ['sight', 'Persons with Impaired Sight or Hearing and Persons Totally Disabled', 'E-8-10.6 & .7']] },

          { heading: 'All exemptions', items: [['xf', 'Exemption Forms'], ['xq', 'Exemption FAQ', '→ FAQ: Home Exemption']] }

      de: { label: 'Dedications', short: 'dedications', desc: 'Property owner commits to certain conditions for a stated period of time in return for reduced taxes.',

        callout: 'Visit the Department of Planning and Permitting website for Affordable Housing information.',

    const pageGroup = {}; const pageLabel = {}; const pageForm = {};
    Object.keys(groups).forEach((g) => groups[g].sections.forEach((s) => s.items.forEach(([id, label, form]) => { pageGroup[id] = g; pageLabel[id] = label; pageForm[id] = form || ''; })));

    const toggle = (g) => () => this.setState({ openSub: g === 'ex' ? 'For homeowners' : S.openSub, view: g, open: S.open === g && S.view === g ? null : g });

    const base = 'width: 100%; text-align: left; font: inherit; cursor: pointer; border: none; border-top: 1px solid #e3e3e3; min-height: 44px; ';

      const nested = g === 'ex' && (this.props.exemptionMenu ?? 'Sub-lists') === 'Sub-lists';
      if (isOpen) groups[g].sections.forEach((s) => {
        const sub = nested && s.heading && s.heading !== 'All exemptions';
        if (sub) {
          const hasView = s.items.some(([id]) => id === S.view);

    const roh = (label) => { const m = /Honolulu (8-(\d+)(\.[\d.]+)?(.*))$/.exec(label); if (!m) return label; const a = ART[+m[2]]; return a ? 'ROH Chapter 8, Article ' + m[2] + ' – ' + a + ' (§ ' + m[1].trim() + ')' : label; };

          'Claims submitted by September 30 and approved will take effect in the following tax year.'

        facts: [{ k: 'Exemption amount', v: '$120,000 ($160,000 if 65+)' }, { k: 'Starting July 1, 2027', v: '$140,000 ($180,000 if 65+)' }, { k: 'Filing deadline', v: 'September 30' }],

      vet: { online: true, howTo: 'To apply, download the form, complete it, and submit to our office.',
        paras: ['If you are a totally disabled veteran due to injuries sustained while on active duty with the U.S. Armed Forces, your home may be eligible for an exemption from real property taxes, except for the minimum tax. For this special exemption, veterans must file a claim on form E-8-10.5. The exemption shall take effect beginning with the next tax payment date, provided that the claimant shall have filed with the department a claim for a disability exemption along with a copy of a physician’s certificate of disability on such form as the department shall prescribe on or before June 30 for the first payment or December 31 for the second payment. The exemption will remain in effect as long as the veteran claiming the exemption remains totally disabled or the widow or widower of the totally disabled veteran remains unmarried.'],

      lep: { online: true, howTo: 'To apply, download the form, complete it, and submit to our office.',
        paras: ['If you have Hansen’s Disease and are confined because of the illness, you may qualify for an exemption from real property taxes on your real property, up to but not exceeding a taxable value of $25,000. This is in addition to your regular home exemption. If you are on a temporary release status, you can retain your exemption during that period.', 'Claims for this special exemption must be filed on form E-8-10.6 and E-8-10.7 on or before September 30.'],
        facts: [{ k: 'Exemption amount', v: 'Up to $25,000 taxable value' }, { k: 'In addition to', v: 'Regular home exemption' }, { k: 'Filing deadline', v: 'September 30' }],

      sight: { online: true, howTo: 'To apply, download the form, complete it, and submit to our office.',
        paras: ['If you have impaired sight or hearing or are totally disabled, you may file a claim on form E-8-10.6 and .7 to qualify for a $25,000 real property tax exemption on property you own. This claim is in addition to the regular or multiple home exemption. Your condition must be certified by an authorized physician who is licensed to practice medicine in the State of Hawaii. “Certification” will be determined on the basis of a written report resulting from an examination performed by the authorized physician.'],
        facts: [{ k: 'Exemption amount', v: '$25,000' }, { k: 'In addition to', v: 'Regular or multiple home exemption' }, { k: 'Requires', v: 'Certification by a Hawaii-licensed physician' }],
        docs: [doc('PDF', 'Form E-8-10.6 & E-8-10.7'), doc('ROH', 'Revised Ordinances of Honolulu 8-10.7')] },
      x1: { online: true, onlineLabel: 'File Online – Charitable Non-Profit', howTo: 'To apply, download the form, complete it, and submit to our office.',
        paras: ['The exemption for charitable purposes provides tax relief for properties used exclusively for nonprofit activities, including accredited educational programs, licensed child-care centers, hospitals and nursing homes, churches and cemeteries, land dedicated to public use, certain labor-related or credit-union nonprofits, and charitable or patriotic organizations whose assets must remain dedicated to public or charitable purposes. Only the qualifying portion of a property may be exempt, and no part of the property may provide monetary or economic benefit to private individuals or members.'],
        facts: [{ k: 'Who', v: 'Nonprofits using the property exclusively for qualifying purposes' }, { k: 'Exempt', v: 'Only the qualifying portion of the property' }],
        docs: [doc('PDF', 'Form E-8-10.9'), doc('ROH', 'Revised Ordinances of Honolulu 8-10.9')] },
      x2: { online: false, links: [lnk('Historic Residential Dedication Tax Benefit List', 'PDF')], howTo: 'To apply, download the form, complete it, and submit to our office.',
        paras: ['Owners of homes listed on the Hawaiʻi Register of Historic Places may qualify for a real property tax exemption by dedicating all or part of their residential property for historic preservation, which requires maintaining the home in at least average condition and providing the public with either continuous visual access from a public way or, if that is not possible, scheduled on-site viewing opportunities. The owner of an approved historic home must install and maintain a city-approved historic plaque on the property. Once an application is approved, the dedication lasts a minimum of 10 years and renews automatically. Failure to meet the program requirements will result in cancellation and a rollback tax with penalties.'],
        facts: [{ k: 'Who', v: 'Homes on the Hawaiʻi Register of Historic Places' }, { k: 'Minimum term', v: '10 years, renews automatically' }, { k: 'Requires', v: 'City-approved historic plaque; public visual access' }],

        facts: [{ k: 'Exemption amount', v: '50% of taxable value' }, { k: 'Minimum term', v: '10 years, renews automatically' }, { k: 'Requires', v: 'Recorded covenant + approved maintenance agreement' }],

        paras: ['Portions of urban-district property may be exempt from real property taxes when an owner formally dedicates specific areas for landscaping, open spaces, public recreation, or similar public-benefit uses, and the director determines that the public benefit of the dedication is at least equal to the value of the taxes being waived. Once approved, the owner must maintain the dedicated land for at least 10 years, with automatic renewals. Any failure to maintain or preserve the dedicated use triggers cancellation and rollback taxes, with interest, applied retroactively to the original dedication date.'],

        paras: ['Improvements used exclusively for a renewable energy improvement may qualify for a full exemption from real property taxes, and the portion of land in physical contact with renewable-energy structures is 80% exempt, but only when the facility operates under any required special or conditional use permits and produces or stores energy primarily for public utilities or public consumption under a power-purchase agreement; the exemption must be claimed by September 30, lasts for the term of the power-purchase contract, cannot be combined with other exemptions or dedications on the same land portion, does not apply to systems used mainly for personal or private business purposes or to solar devices already excluded from taxation, and may be denied or canceled if documentation is not provided or if renewable-energy production stops.'],
        facts: [{ k: 'Improvements', v: '100% exempt' }, { k: 'Land in contact with structures', v: '80% exempt' }, { k: 'Filing deadline', v: 'September 30' }, { k: 'Lasts', v: 'Term of the power-purchase agreement' }],
        docs: [doc('PDF', 'Form E-8-10.12'), doc('ROH', 'Revised Ordinances of Honolulu 8-10.12')] },

        paras: ['Public property may qualify for an exemption from real property taxes, with taxes instead assessed to private tenants or occupants when government-owned land is leased, used commercially, or held under agreements for future conveyance. Additional exemptions include land subject to eminent domain, property taken into possession for future public use, parcels rendered unusable by setback requirements, and any property exempt under federal or other applicable laws.'],

        paras: ['Off-base military housing developed and operated under the Military Housing Privatization Initiative may be exempt from real property taxes if the federal land is leased to a private company specifically to develop, rehabilitate, maintain, and operate a military housing project, and the project does not use county refuse, road maintenance, or routine police, fire, and ambulance services.'],
        facts: [{ k: 'Who', v: 'Private lessees of federal land under the Military Housing Privatization Initiative' }, { k: 'Condition', v: 'No county refuse, road maintenance, or routine police, fire & ambulance services' }],
        docs: [doc('PDF', 'Form E-8-10.15'), doc('ROH', 'Revised Ordinances of Honolulu 8-10.15')] },
      x8: { online: false, howTo: 'To apply, download the form, complete it, and submit to our office.',
        paras: ['Low-income rental housing that is regulated for at least 15 years under a government-approved agreement—and reserves at least 20% of its units for households earning no more than 80% of area median income—may qualify for an exemption from real property taxes for the entire regulated period. The exemption applies only to the residential portion of the project.'],
        facts: [{ k: 'Regulated for', v: 'At least 15 years' }, { k: 'Units reserved', v: 'At least 20% for households at or below 80% AMI' }, { k: 'Exempt', v: 'Residential portion only' }],

        paras: ['All real property in the city used exclusively by the owner or lessee thereof for purposes of slaughtering or butchering cattle, pigs, poultry animals, or other domestic livestock for commercial slaughterhouse purposes may be exempt from real property taxes for a period of 10 years. In the case of newly constructed slaughterhouses, the exemption shall apply to the tax year following October 1 following commencement of construction of such slaughterhouse.'],
        facts: [{ k: 'Term', v: '10 years' }, { k: 'New construction', v: 'Tax year after the Oct. 1 following start of construction' }],

      x11: { online: false, howTo: 'To apply, download the form, complete it, and submit to our office.',

        facts: [],
        docs: [doc('PDF', 'Form E-8-10.24'), doc('ROH', 'Revised Ordinances of Honolulu 8-10.24')] },
      x12: { online: false, heading: 'Exemption – Qualifying Agricultural Improvements for Dedicated Vacant Agricultural Lands', howTo: 'To apply, download the form, complete it, and submit to our office.',

        paras: ['Real property that contains kuleana land may qualify for the kuleana exemption and pay only the minimum real property tax as long as the property is owned wholly or in part by a lineal descendant of the original awardee of that kuleana parcel. Owners must provide genealogy verification, such as confirmation from the Office of Hawaiian Affairs or a court order. “Kuleana land” refers to the original native tenant awards from the 1850 Kuleana Act.'],

        paras: ['A for-profit group child care center may qualify for a full property tax exemption when the property is used exclusively for child care, meets state licensing requirements, is owned or leased long-term, and, if leased, has a recorded lease. The exemption applies only to non-residential facilities serving infants, toddlers, and preschool-age children, and the property cannot receive any other exemption at the same time.'],
